<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Giáo Án Lớp 5 - Thầy Lê Văn Hoàng</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #e2e8f0; color: #1e293b; padding: 50px 20px; text-align: center; }
        
        /* Tiêu đề trang */
        .title-container { margin-bottom: 30px; }
        h1 { font-size: 24px; color: #0f172a; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; text-transform: uppercase; }
        p { color: #64748b; font-size: 14px; }
        
        /* Cấu trúc lưới 3 cột chứa các nút */
        .grid-container { display: grid; grid-template-columns: repeat(3, minmax(200px, 260px)); gap: 15px; justify-content: center; max-width: 850px; margin: 0 auto; }
        
        /* Kiểu dáng Nút bấm màu xanh bo tròn chuẩn như ảnh */
        .btn-mon { background-color: #1d4ed8; color: #ffffff !important; text-decoration: none; padding: 14px 20px; border-radius: 10px; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: all 0.2s ease; }
        .btn-mon:hover { background-color: #1e40af; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        
        /* Nút Công nghệ nằm ở giữa hàng cuối */
        .btn-full { grid-column: 2; }

        @media (max-width: 768px) {
            .grid-container { grid-template-columns: 1fr; }
            .btn-full { grid-column: auto; }
        }
    </style>
</head>
<body>

    <div class="title-container">
        <h1>📚 KHO GIÁO ÁN LỚP 5 - THẦY LÊ VĂN HOÀNG</h1>
        <p>Bấm vào môn học bên dưới để mở trực tiếp thư mục Google Drive tương ứng</p>
    </div>

    <div class="grid-container">
        <a href="https://drive.google.com/drive/folders/12oMXGzn6wAMbPr5NXxjkuxAjOtgT9rtv" target="_blank" class="btn-mon"><i class="fa-solid fa-calculator"></i> Môn Toán 5</a>
        <a href="https://drive.google.com/drive/folders/1r2xvXn4WJciIYQ00g93mceThGemRQANp" target="_blank" class="btn-mon"><i class="fa-solid fa-book"></i> Tiếng Việt 5</a>
        <a href="https://drive.google.com/drive/folders/1ex_t0W3OzOOxYd981-F5Kk4rB7pOFGgU" target="_blank" class="btn-mon"><i class="fa-solid fa-flask"></i> Khoa Học 5</a>
        <a href="https://drive.google.com/drive/folders/1SmjF8XWwPUIVgBBRmpqJ_197j01__aqJ" target="_blank" class="btn-mon"><i class="fa-solid fa-earth-americas"></i> Lịch Sử & Địa Lí 5</a>
        <a href="https://drive.google.com/drive/folders/1FAzA8V1ZFir_BrwNjsl1gK9giJvrYM2x" target="_blank" class="btn-mon"><i class="fa-solid fa-users"></i> Hoạt Động Trải Nghiệm 5</a>
        <a href="https://drive.google.com/drive/folders/1csmwmGcAHCHOk8faGuSOIM4Mj0PVyhw3" target="_blank" class="btn-mon"><i class="fa-solid fa-seedling"></i> Đạo Đức 5</a>
        <a href="https://drive.google.com/drive/folders/1iB3fgdSWjU5hZitashNDDAvNXEBakKQt" target="_blank" class="btn-mon btn-full"><i class="fa-solid fa-microchip"></i> Công Nghệ 5</a>
    </div>

</body>
</html>
