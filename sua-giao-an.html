<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache">
<meta name="robots" content="noindex,nofollow">
<title>🛠️ Trang Sửa Giáo Án · v6.0 MASTER CLEAN</title>
<style>body{font-family:Arial,sans-serif;padding:30px;background:#f4f7fb;color:#172033}#box{max-width:700px;margin:auto;background:#fff;border:1px solid #d8e1ee;border-radius:14px;padding:22px}.err{color:#b4232c;font-weight:700}</style>
</head><body>
<div id="box"><p>Đang mở <b>Trang Sửa Giáo Án v6.0 MASTER CLEAN</b>…</p></div>
<script>
(async()=>{
 const box=document.getElementById('box');
 try{
  const u='sua-giao-an/v60.html?v=6.0&cb='+Date.now();
  const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
  let html=await r.text();
  const tag='<script src="/gochoctap/sua-giao-an/subject-picker.js?v=6.0&cb='+Date.now()+'"></script>';
  html=html.replace('</body>',tag+'</body>');
  document.open();document.write(html);document.close();
 }catch(e){box.innerHTML='<p class="err">Không tải được v6.0: '+String(e.message||e)+'</p>'}
})();
</script></body></html>
