<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🛠️ TRANG SỬA GIÁO ÁN · v6.1 FINAL</title><style>body{margin:0;font:14px Arial;background:#f4f7fb;color:#172033}.bar{position:sticky;top:0;z-index:5;background:#0b1734;color:#fff;padding:10px}.bar b{font-size:16px}.btn{padding:9px 12px;margin:3px;border:0;border-radius:8px;font-weight:800;cursor:pointer}.p{background:#1f5eea;color:#fff}.g{background:#eaf8ef;color:#087f46}.y{background:#fff8df;color:#8a5b00}.i{background:#eef2f6}.wrap{padding:8px}.status{background:#fff;border:1px solid #ccd6e5;border-radius:8px;padding:8px;margin-top:6px}.frame{width:100%;height:calc(100vh - 150px);border:1px solid #ccd6e5;border-radius:10px;background:#fff}</style></head><body><div class="bar"><b>🛠️ CÔNG CỤ RIÊNG · GIÁO VIÊN · v6.1</b><button class="btn p" id="run">▶️ CHẠY LUỒNG 05→07</button><button class="btn g" id="approve">05 · DUYỆT HIGH</button><button class="btn y" id="validate">06 · VALIDATE</button><button class="btn p" id="export">07 · XUẤT WORD/ZIP</button><span id="st" style="margin-left:8px">Đang nạp…</span><div class="status" id="log">Controller: chuẩn bị.</div></div><div class="wrap"><iframe id="app" class="frame" src="v60.html?v=6.0&cb=202609030700"></iframe></div><script>
'use strict';
const f=document.getElementById('app'),st=document.getElementById('st'),log=document.getElementById('log');
const q=(id)=>f.contentDocument?.getElementById(id);
function say(x){log.textContent=new Date().toLocaleTimeString('vi-VN')+' · '+x;st.textContent=x}
function click(id){const e=q(id);if(!e)throw Error('Không tìm thấy #'+id);e.disabled=false;e.click()}
function ready(){return !!f.contentDocument}
f.addEventListener('load',()=>say('✅ Trang lõi đã tải. Controller sẵn sàng.'));
document.getElementById('approve').onclick=()=>{try{click('approveHigh');say('05 · Đã gọi Duyệt chắc chắn. Kiểm tra Change Set trong trang lõi.')}catch(e){say('❌ '+e.message)}};
document.getElementById('validate').onclick=()=>{try{click('validate');say('06 · Đã gọi Validator. Nếu PASS, có thể Apply trong trang lõi.')}catch(e){say('❌ '+e.message)}};
document.getElementById('export').onclick=()=>{try{const n=q('word');const z=q('zip');if(n&&!n.disabled){n.click();say('07 · Đã gọi Xuất Word')}else if(z&&!z.disabled){z.click();say('07 · Đã gọi Xuất ZIP')}else say('⚠️ Chưa đủ điều kiện xuất: cần duyệt + sửa + validate PASS.')}catch(e){say('❌ '+e.message)}};
document.getElementById('run').onclick=async()=>{try{if(!ready())throw Error('Trang lõi chưa sẵn sàng');const files=q('files');const subs=[...f.contentDocument.querySelectorAll('.sub:checked')];if(!files?.files?.length){say('⚠️ Bước 01: hãy nạp DOCX ở trang lõi.');return}if(!subs.length){say('⚠️ Bước 02: hãy chọn môn ở trang lõi.');return}click('scan');say('03 · Đã gọi QUÉT TOÀN BỘ');await new Promise(r=>setTimeout(r,500));const high=q('approveHigh');if(high&&!high.disabled){high.click();say('05 · Đã duyệt các đề xuất HIGH có bằng chứng.');await new Promise(r=>setTimeout(r,300))}const apply=q('apply');if(apply&&!apply.disabled){apply.click();say('06 · Đã gọi SỬA + VALIDATE.')}else{click('validate');say('06 · Validator đã được gọi; cần duyệt thêm nếu còn Change Set.')}}catch(e){say('❌ Luồng lỗi: '+e.message)}};
</script></body></html>
