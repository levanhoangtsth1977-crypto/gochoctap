<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>🛠️ TRANG SỬA GIÁO ÁN · v6.6 STABLE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" title="Trang Sửa Giáo Án"></iframe><script>
(function(){
'use strict';
var f=document.getElementById('app');
f.src='./v64.html?stable=v66&cb='+Date.now();
function textOf(el){return (el&&el.textContent||'').replace(/\s+/g,' ').trim();}
function install(){
  try{
    var w=f.contentWindow,d=w.document;
    if(!d||!d.body)return;
    if(typeof w.xmlText!=='function'){
      w.xmlText=function(xml){
        var x=new w.DOMParser().parseFromString(String(xml||''),'application/xml');
        if(x.getElementsByTagName('parsererror').length)throw new Error('XML không hợp lệ');
        return x.documentElement?(x.documentElement.textContent||''):'';
      };
    }
    var report=d.getElementById('report');
    if(!report)return;
    var box=d.getElementById('subjectReportV66');
    if(!box){
      box=d.createElement('div');box.id='subjectReportV66';box.className='st';box.style.marginTop='8px';
      report.parentNode.appendChild(box);
    }
    function update(){
      var labels={LICH_SU_DIA_LI:'Lịch sử - Địa lí',DAO_DUC:'Đạo đức',TOAN:'Toán',TIENG_VIET:'Tiếng Việt',KHOA_HOC:'Khoa học',CONG_NGHE:'Công nghệ',HDTN:'Hoạt động trải nghiệm'};
      var selected=[].slice.call(d.querySelectorAll('.sub:checked')).map(function(x){return x.value});
      var cards=[].slice.call(d.querySelectorAll('#changes .change'));
      var lines=['📊 BÁO CÁO THEO TỪNG MÔN'];
      selected.forEach(function(s){
        var n=cards.filter(function(c){return textOf(c).indexOf('· '+labels[s]+' ·')>=0}).length;
        var ai=cards.filter(function(c){var t=textOf(c);return t.indexOf('· '+labels[s]+' ·')>=0&&t.indexOf('GEM-')>=0}).length;
        lines.push('• '+labels[s]+': Rule '+(n-ai)+' · Gemini '+ai+' · Tổng '+n);
      });
      lines.push('• Tổng Change Set: '+cards.length);
      box.textContent=lines.join('\n');
    }
    update();
    if(!w.__v66observer){
      w.__v66observer=new w.MutationObserver(update);
      w.__v66observer.observe(d.getElementById('changes')||d.body,{subtree:true,childList:true,characterData:true});
    }
  }catch(e){
    try{var d=f.contentDocument,g=d&&d.getElementById('gemStatus');if(g)g.textContent='❌ v6.6: '+e.message;}catch(_){}}
}
f.addEventListener('load',function(){setTimeout(install,0);setTimeout(install,250);setTimeout(install,1000);});
})();
</script></body></html>
