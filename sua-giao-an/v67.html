<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>🛠️ TRANG SỬA GIÁO ÁN · v6.7 GEMINI FAILSAFE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" title="Trang Sửa Giáo Án"></iframe><script>
(function(){
'use strict';
var f=document.getElementById('app');
f.src='./v64.html?stable=v67&cb='+Date.now();
var MODELS=['gemini-3.8-flash','gemini-3.7-flash','gemini-3.6-flash'];
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function status(text){try{var d=f.contentDocument,g=d&&d.getElementById('gemStatus');if(g)g.textContent=text;}catch(e){}}
function makeUrl(url,model){return url.replace(/\/models\/[^/:]+(?=:generateContent)/,'/models/'+model);}
function install(){
 try{
  var w=f.contentWindow;if(!w||!w.fetch||w.__v67Installed)return;
  var nativeFetch=w.fetch.bind(w);w.__v67Installed=true;
  w.fetch=async function(input,init){
   var url=typeof input==='string'?input:(input&&input.url)||'';
   if(!/generativelanguage\.googleapis\.com\/v1beta\/models\/[^/]+:generateContent/i.test(url))return nativeFetch(input,init);
   var selected=(String(url).match(/\/models\/([^/:]+):generateContent/i)||[])[1]||MODELS[0];
   var order=[selected].concat(MODELS.filter(function(m){return m!==selected;}));
   var lastResponse=null;
   for(var mi=0;mi<order.length;mi++){
    var model=order[mi], target=makeUrl(url,model);
    for(var attempt=0;attempt<3;attempt++){
     try{
      if(mi>0&&attempt===0)status('⏳ '+selected+' đang bận · tự chuyển '+model+'…');
      var response=await nativeFetch(target,init);lastResponse=response;
      if(response.status!==503&&response.status!==429&&response.status!==500)return response;
      if(attempt<2)await sleep(700*(attempt+1));
     }catch(err){
      if(attempt===2&&mi===order.length-1)throw err;
      if(attempt<2)await sleep(700*(attempt+1));
     }
    }
   }
   status('❌ Gemini tạm thời không khả dụng trên cả 3 model. HTTP '+(lastResponse?lastResponse.status:'503'));
   return lastResponse;
  };
  status('✅ Gemini Failsafe · retry + 3.8→3.7→3.6 đã sẵn sàng.');
 }catch(e){status('❌ Failsafe: '+e.message);}
}
f.addEventListener('load',function(){install();setTimeout(install,100);setTimeout(install,500);setTimeout(install,1200);});
})();
</script></body></html>
