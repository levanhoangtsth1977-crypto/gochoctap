<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Sửa giáo án v5.4</title><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>body{font:14px Arial;background:#f4f7fb;margin:0;color:#172033}.w{max-width:1400px;margin:auto;padding:14px}.c{background:#fff;border:1px solid #dce3ee;border-radius:12px;padding:12px;margin:10px 0}.g{display:grid;grid-template-columns:340px 1fr;gap:10px}.b{padding:9px 12px;border:0;border-radius:8px;font-weight:700;margin:3px;cursor:pointer}.p{background:#1f5eea;color:#fff}.ok{background:#eaf8ef;color:#087f46}.no{background:#fff0f1;color:#b4232c}.i{background:#eef2f6}.x{width:100%;box-sizing:border-box;padding:9px;margin:4px 0;border:1px solid #ccd6e5;border-radius:8px}.s{border:1px solid #dce3ee;border-radius:8px;padding:8px;white-space:pre-wrap}.old{background:#fff2f2;padding:6px;border-radius:6px}.new{background:#effaf3;padding:6px;border-radius:6px}.change{border:1px solid #dce3ee;border-radius:9px;padding:8px;margin:6px 0}.ap{border-left:5px solid #087f46}@media(max-width:900px){.g{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="c" style="background:#0b1734;color:#fff"><h1>🛠️ TRANG SỬA GIÁO ÁN · v5.4 VIP</h1><div>Quét toàn bộ XML văn bản DOCX · nhận diện biến thể địa danh · Safe Mutation · Validator · Export</div></div><div class="g"><aside><div class="c"><h2>📥 Nạp</h2><input id="files" class="x" type="file" accept=".docx,.zip" multiple><div id="picked" class="s">Chưa nạp.</div><select id="subject" class="x"><option value="">Tất cả môn</option><option>Lịch sử - Địa lí</option><option>Đạo đức</option><option>Toán</option><option>Tiếng Việt</option><option>Khoa học</option></select><input id="lesson" class="x" placeholder="Bài / Tiết"><button id="scan" class="b p" disabled>🔍 QUÉT TOÀN BỘ</button></div><div class="c"><h2>🤖 Gemini</h2><input id="key" class="x" type="password" placeholder="Gemini API Key"><label><input id="remember" type="checkbox"> Ghi nhớ trên thiết bị</label><button id="test" class="b i">🧪 Kiểm tra</button><div id="aiStatus" class="s">Chưa gọi.</div></div></aside><main><div class="c"><h2>📊 Báo cáo</h2><div id="report" class="s">Chưa quét.</div></div><div class="c"><h2>✅ Change Set</h2><button id="high" class="b ok" disabled>Duyệt chắc chắn</button><button id="all" class="b i" disabled>Duyệt tất cả</button><button id="none" class="b no" disabled>Từ chối tất cả</button><button id="apply" class="b p" disabled>Áp dụng</button><div id="changes" class="s">Chưa có.</div></div><div class="c"><h2>🔎 Validator</h2><div id="validator" class="s">Chưa sửa.</div><div id="preview" class="s" style="max-height:420px;overflow:auto">Chưa có.</div></div><div class="c"><h2>📤 Xuất</h2><button id="word" class="b p" disabled>Word</button><button id="zip" class="b p" disabled>ZIP cả tuần</button><button id="log" class="b i" disabled>Change Log</button></div></main></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),W='http://schemas.openxmlformats.org/wordprocessingml/2006/main',S='le-hoang-gemini-api-key',R='le-hoang-gemini-remember';let docs=[],rules=[],changes=[],audit=[];const alias={'đạo đức':'DAO_DUC','lịch sử - địa lí':'LICH_SU_DIA_LI','toán':'TOAN','tiếng việt':'TIENG_VIET','khoa học':'KHOA_HOC'};const place={'hà giang':'Tuyên Quang','bà rịa - vũng tàu':'Thành phố Hồ Chí Minh','quảng bình':'Quảng Trị','kiên giang':'An Giang','bắc kạn':'Thái Nguyên','bắc giang':'Bắc Ninh','ninh thuận':'Khánh Hòa','quảng nam':'Đà Nẵng','bình định':'Gia Lai','nam định':'Ninh Bình','hải dương':'Hải Phòng','thái bình':'Hưng Yên','yên bái':'Lào Cai','bạc liêu':'Cà Mau'};const norm=s=>String(s||'').replace(/[–—]/g,'-').replace(/\s+/g,' ').trim().toLowerCase();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const text=xml=>[...new DOMParser().parseFromString(xml,'application/xml').getElementsByTagNameNS(W,'t')].map(x=>x.textContent||'').join(' ');
function parts(z){return Object.keys(z.files).filter(n=>/^word\/(document|header\d+|footer\d+|footnotes|endnotes|comments)\.xml$/i.test(n)&&!z.files[n].dir)}async function add(f){const z=await JSZip.loadAsync(await f.arrayBuffer()),d={name:f.name,z,parts:{}};for(const p of parts(z))d.parts[p]=await z.file(p).async('string');docs.push(d)}$('files').onchange=async()=>{docs=[];try{for(const f of $('files').files){if(/\.docx$/i.test(f.name))await add(f);else if(/\.zip$/i.test(f.name)){const z=await JSZip.loadAsync(await f.arrayBuffer());for(const n of Object.keys(z.files))if(/\.docx$/i.test(n)&&!z.files[n].dir)await add(new File([await z.files[n].async('arraybuffer')],n.split('/').pop()))}}$('picked').textContent='✅ '+docs.length+' tài liệu đã nạp.';$('scan').disabled=!docs.length}catch(e){$('picked').textContent='❌ '+e.message}};
async function loadRules(){const r=await fetch('./curriculum-adjustments-2026-2027.json?cb='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Không tải được danh mục điều chỉnh.');const j=await r.json();rules=[];for(const [subject,rows] of Object.entries(j.subjects||{}))for(const x of rows)rules.push({...x,subject})}
function variants(rule,raw){const s=norm(raw),o=norm(rule.old),out=[];if(s.includes(o))out.push(o);const m=o.match(/^(.+?)[(（]([^()]+)[)）]$/);if(m){const a=norm(m[1]).trim().split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s+');const b=norm(m[2]).trim().split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s+');const q=new RegExp(a+'\\s*(?:ở|tại|thuộc|nằm|là)?\\s*(?:tỉnh|thành phố|huyện|xã|thị trấn)?\\s*'+b,'i');const h=raw.match(q);if(h)out.push(norm(h[0]))}return[...new Set(out)]}
function admin(raw){const s=norm(raw),out=[];for(const [o,n] of [['63 tỉnh, thành phố','34 đơn vị hành chính cấp tỉnh, gồm 27 tỉnh và 7 thành phố trực thuộc Trung ương'],['63 tỉnh','34 đơn vị hành chính cấp tỉnh, gồm 27 tỉnh và 7 thành phố trực thuộc Trung ương'],['5 thành phố trực thuộc trung ương','7 thành phố trực thuộc Trung ương'],['28 tỉnh và 6 thành phố','27 tỉnh + 7 thành phố trực thuộc Trung ương']]){const re=new RegExp(o,'ig');let m;while((m=re.exec(s)))out.push({id:'ADMIN-'+o,old:m[0],anchor:m[0],new:n,engine:'Administrative Data',status:'PROPOSED',confidence:.995,reason:'Phát hiện dữ liệu hành chính cũ.'})}for(const [o,n] of Object.entries(place)){const re=new RegExp('(?:tỉnh\\s+)?'+o.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');let m;while((m=re.exec(s)))out.push({id:'PLACE-'+o,old:m[0],anchor:m[0],new:n,engine:'Administrative Locality',status:'REVIEW_REQUIRED',confidence:.94,reason:'Địa danh có thể là tên cũ; cần đối chiếu ngữ cảnh.'})}return out}
function scan(){changes=[];for(const d of docs)for(const [part,xml] of Object.entries(d.parts)){const raw=text(xml);for(const r of rules){const wanted=$('subject').value;if(wanted&&r.subject!==alias[norm(wanted)])continue;const lesson=norm($('lesson').value);if(lesson&&r.lesson&& !norm(r.lesson).includes(lesson)&&!lesson.includes(norm(r.lesson)))continue;for(const a of variants(r,raw))changes.push({...r,document:d.name,part,anchor:a,approved:false})}for(const c of admin(raw))changes.push({...c,document:d.name,part,approved:false})}const seen=new Set();changes=changes.filter(x=>{const k=[x.document,x.part,x.id,x.anchor].join('|');if(seen.has(k))return false;seen.add(k);return true});$('report').textContent='✅ Quét '+docs.length+' tài liệu · '+Object.values(docs.flatMap(d=>d.parts).length||0)+' phần XML · '+changes.length+' Change Set.';render();$('high').disabled=!changes.length;$('all').disabled=!changes.length;$('none').disabled=!changes.length}
function render(){$('changes').innerHTML=changes.length?changes.map((c,i)=>'<div class="change '+(c.approved?'ap':'')+'"><b>#'+(i+1)+' '+esc(c.id)+'</b> · '+esc(c.status)+' · '+esc(c.engine||'')+'<div>📄 '+esc(c.document)+' / '+esc(c.part)+'</div><div class="old">OLD: '+esc(c.anchor)+'</div><div class="new">NEW: '+esc(c.new)+'</div><div>'+esc(c.reason||'')+'</div><button class="b ok" onclick="window.ap('+i+')">Duyệt</button><button class="b no" onclick="window.rj('+i+')">Từ chối</button></div>').join(''):'Không có Change Set.';$('apply').disabled=!changes.some(c=>c.approved)}window.ap=i=>{changes[i].approved=true;render()};window.rj=i=>{changes[i].approved=false;changes[i].rejected=true;render()};$('high').onclick=()=>{changes.forEach(c=>{if(c.status==='PROPOSED'&&c.confidence>=.97)c.approved=true});render()};$('all').onclick=()=>{changes.forEach(c=>{if(c.anchor)c.approved=true});render()};$('none').onclick=()=>{changes.forEach(c=>{c.approved=false;c.rejected=true});render()};
function mutate(xml,anchor,repl){const d=new DOMParser().parseFromString(xml,'application/xml');for(const p of [...d.getElementsByTagNameNS(W,'p')]){const rs=[...p.getElementsByTagNameNS(W,'r')].map(r=>{const t=r.getElementsByTagNameNS(W,'t');return t.length===1?{r,t:t[0],v:t[0].textContent||''}:null}).filter(Boolean);const raw=rs.map(x=>x.v).join('');const nr=norm(raw),na=norm(anchor),at=nr.indexOf(na);if(at<0)continue;if(rs.length!==1)return{ok:false,why:'Anchor trải qua nhiều Word Run; đã chặn để bảo toàn định dạng.'};const x=rs[0],before=raw.slice(0,at),after=raw.slice(at+na.length);x.t.textContent=before;const rr=d.createElementNS(W,'w:r'),rp=d.createElementNS(W,'w:rPr'),it=d.createElementNS(W,'w:i'),co=d.createElementNS(W,'w:color');co.setAttribute('w:val','C00000');rp.append(it,co);rr.append(rp);const t=d.createElementNS(W,'w:t');t.setAttribute('xml:space','preserve');t.textContent=repl;rr.append(t);x.r.parentNode.insertBefore(rr,x.r.nextSibling);if(after){const ar=x.r.cloneNode(true);ar.getElementsByTagNameNS(W,'t')[0].textContent=after;x.r.parentNode.insertBefore(ar,rr.nextSibling)}return{ok:true,xml:new XMLSerializer().serializeToString(d)}}return{ok:false,why:'Không tìm thấy anchor.'}
}
$('apply').onclick=()=>{let ok=0,bad=0;for(const c of changes.filter(x=>x.approved&&!x.rejected)){const d=docs.find(x=>x.name===c.document);const r=d&&mutate(d.parts[c.part],c.anchor,c.new);if(r?.ok){d.parts[c.part]=r.xml;ok++;audit.push('OK '+c.id+' · '+c.anchor+' → '+c.new)}else{bad++;audit.push('BLOCK '+c.id+' · '+(r?.why||'không có'))}}$('validator').textContent=bad?'⚠️ '+ok+' sửa được; '+bad+' bị chặn để bảo toàn.':'✅ '+ok+' thay đổi đã áp dụng.';$('preview').textContent=docs.flatMap(d=>Object.entries(d.parts).map(([p,x])=>d.name+' | '+p+'\n'+text(x))).join('\n\n').slice(0,80000);$('word').disabled=!ok;$('zip').disabled=!ok;$('log').disabled=!audit.length;$('log').onclick=()=>{const b=new Blob([audit.join('\n')],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='CHANGE_LOG.txt';a.click()}}
async function build(d){for(const [p,x] of Object.entries(d.parts))d.z.file(p,x);return d.z.generateAsync({type:'blob'})}function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}$('word').onclick=async()=>dl(await build(docs[0]),docs[0].name.replace(/\.docx$/i,'')+'_DA_SUA.docx');$('zip').onclick=async()=>{const z=new JSZip();for(const d of docs)z.file(d.name,await build(d));dl(await z.generateAsync({type:'blob'}),'GIAO_AN_DA_SUA_CA_TUAN.zip')};
async function gem(){const k=$('key').value.trim();if(!k)throw Error('Chưa nhập API Key.');const m=$('model')?.value||'gemini-3.7-flash';const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Trả lời đúng một câu: Kết nối Gemini thành công.'}]}]})});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();return j.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('')||'OK'}$('test').onclick=async()=>{try{$('aiStatus').textContent=await gem()}catch(e){$('aiStatus').textContent='❌ '+e.message}};$('scan').onclick=async()=>{try{$('msg')&&($('msg').textContent='');await loadRules();scan();audit.push('SCAN toàn bộ DOCX')}catch(e){$('report').textContent='❌ '+e.message}};
})();</script></body></html>
