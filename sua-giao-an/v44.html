<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>🛠️ Trang Sửa Giáo Án v4.4</title>
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="./v42.html?embedded=1&cb=20260901-v44" title="Trang Sửa Giáo Án v4.4"></iframe>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(function(){'use strict';
const f=document.getElementById('app');
const MODELS=['gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash-lite'];
function textOf(doc){return Array.from(doc.getElementsByTagName('w:p')).map(p=>Array.from(p.getElementsByTagName('w:t')).map(t=>t.textContent||'').join('')).join('\n')}
function counts(xml){return{p:(xml.match(/<w:p\b/g)||[]).length,t:(xml.match(/<w:tbl\b/g)||[]).length,i:(xml.match(/<wp:inline\b/g)||[]).length,s:(xml.match(/<w:sectPr\b/g)||[]).length}}
function escXml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function addRedItalic(doc,run,text){const r=doc.createElementNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main','w:r');const rp=doc.createElementNS(r.namespaceURI,'w:rPr');const i=doc.createElementNS(r.namespaceURI,'w:i');const c=doc.createElementNS(r.namespaceURI,'w:color');c.setAttribute('w:val','C00000');rp.appendChild(i);rp.appendChild(c);r.appendChild(rp);const t=doc.createElementNS(r.namespaceURI,'w:t');t.setAttribute('xml:space','preserve');t.textContent=text;r.appendChild(t);return r}
function cloneRun(doc,run,txt){const r=run.cloneNode(true);Array.from(r.getElementsByTagName('w:t')).forEach(t=>t.parentNode.removeChild(t));const t=doc.createElementNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main','w:t');t.setAttribute('xml:space','preserve');t.textContent=txt;r.appendChild(t);return r}
function replaceAcrossRuns(xml,anchor,repl){
  const parser=new DOMParser();const d=parser.parseFromString(xml,'application/xml');
  if(d.getElementsByTagName('parsererror').length)return{ok:false,reason:'XML Word không hợp lệ.'};
  const ps=Array.from(d.getElementsByTagName('w:p'));
  for(const p of ps){
    const ts=Array.from(p.getElementsByTagName('w:t'));let full='',map=[];
    for(const t of ts){const v=t.textContent||'';map.push({t,start:full.length,end:full.length+v.length});full+=v}
    const at=full.indexOf(anchor);if(at<0)continue;
    if(full.indexOf(anchor,at+1)>=0)return{ok:false,reason:'Anchor trùng nhiều vị trí trong cùng đoạn.'};
    const end=at+anchor.length;
    const a=map.find(x=>at>=x.start&&at<=x.end);const b=map.find(x=>end>=x.start&&end<=x.end);
    if(!a||!b)return{ok:false,reason:'Không ánh xạ được anchor vào run Word.'};
    const affected=map.filter(x=>x.end>at&&x.start<end);const runs=[...new Set(affected.map(x=>x.t.parentNode))];
    if(runs.some(r=>!r||r.localName!=='r'||Array.from(r.childNodes).some(n=>n.nodeType===1&&n.localName!=='rPr'&&n.localName!=='t')))
      return{ok:false,reason:'Anchor nằm trong run có cấu trúc đặc biệt; đã chặn để bảo toàn tài liệu.'};
    if(a.t.parentNode===b.t.parentNode){
      const run=a.t.parentNode, before=(a.t.textContent||'').slice(0,at-a.start), after=(b.t.textContent||'').slice(end-b.start);
      const parent=run.parentNode;parent.insertBefore(cloneRun(d,run,before),run);parent.insertBefore(addRedItalic(d,run,repl),run);if(after)parent.insertBefore(cloneRun(d,run,after),run);parent.removeChild(run);return{ok:true,xml:new XMLSerializer().serializeToString(d),old:full,new:full.slice(0,at)+repl+full.slice(end)};
    }
    const parentA=a.t.parentNode.parentNode,parentB=b.t.parentNode.parentNode;
    const before=(a.t.textContent||'').slice(0,at-a.start);const after=(b.t.textContent||'').slice(end-b.start);
    if(before){parentA.insertBefore(cloneRun(d,a.t.parentNode,before),a.t.parentNode)}
    parentA.parentNode.insertBefore(addRedItalic(d,a.t.parentNode,repl),parentA.nextSibling);
    if(after){parentB.parentNode.insertBefore(cloneRun(d,b.t.parentNode,after),parentB)}
    for(const r of runs){if(r===a.t.parentNode||r===b.t.parentNode){if(r===a.t.parentNode){r.parentNode.removeChild(r)}else{r.parentNode.removeChild(r)}}else if(r.parentNode)r.parentNode.removeChild(r)}
    return{ok:true,xml:new XMLSerializer().serializeToString(d),old:full,new:full.slice(0,at)+repl+full.slice(end)};
  }
  return{ok:false,reason:'Không tìm thấy anchor trong DOCX.'};
}
function getAccepted(win){const box=win.document.getElementById('changes');if(!box)return[];return Array.from(box.querySelectorAll('.change')).filter(x=>/ĐÃ DUYỆT/.test(x.textContent||'')).map(x=>{const id=(x.querySelector('b')||{}).textContent||'';const file=((x.textContent||'').match(/File:\s*([^\n]+?)(?:Lý do:|Đề xuất:|Cũ\/Anchor|Đề xuất$)/)||[])[1]?.trim()||'';const old=x.querySelector('.old')?.textContent?.replace(/^Cũ\/Anchor\s*/,'').trim()||'';const replacement=x.querySelector('.new')?.textContent?.replace(/^Đề xuất\s*/,'').trim()||'';return{id,file,anchor:old,replacement}})}
async function readInputs(win){const fs=Array.from(win.document.getElementById('files')?.files||[]);const out=[];for(const file of fs){if(/\.docx$/i.test(file.name)){const z=await JSZip.loadAsync(await file.arrayBuffer());const e=z.file('word/document.xml');if(e)out.push({name:file.name,z,xml:await e.async('string')})}else if(/\.zip$/i.test(file.name)){const z=await JSZip.loadAsync(await file.arrayBuffer());for(const n of Object.keys(z.files)){if(!/\.docx$/i.test(n)||z.files[n].dir)continue;const bz=await z.files[n].async('blob');const dz=await JSZip.loadAsync(await bz.arrayBuffer());const e=dz.file('word/document.xml');if(e)out.push({name:n.split('/').pop(),z:dz,xml:await e.async('string')})}}}return out}
async function applySafely(win){
  const accepted=getAccepted(win);if(!accepted.length){win.document.getElementById('validator').innerHTML='<span class="err">❌ Chưa có Change Set được duyệt.</span>';return}
  win.document.getElementById('apply').disabled=true;win.document.getElementById('validator').textContent='🔐 Đang chạy Safe DOCX Mutation + Validator 2 lớp…';
  try{
    const docs=await readInputs(win);let applied=0;const errors=[];
    for(const c of accepted){const d=docs.find(x=>x.name===c.file);if(!d){errors.push(c.id+': không tìm thấy file');continue}const before=d.xml;const b=counts(before);const r=replaceAcrossRuns(before,c.anchor,c.replacement);if(!r.ok){errors.push(c.id+': '+r.reason);continue}const a=counts(r.xml);if(JSON.stringify(b)!==JSON.stringify(a)){errors.push(c.id+': thay đổi cấu trúc bị chặn');continue}const parser=new DOMParser();const afterText=textOf(parser.parseFromString(r.xml,'application/xml'));const beforeText=textOf(parser.parseFromString(before,'application/xml'));const expected=beforeText.replace(c.anchor,c.replacement);if(afterText!==expected){errors.push(c.id+': Validator nội dung không khớp');continue}d.xml=r.xml;applied++}
    if(!applied){win.document.getElementById('validator').innerHTML='<span class="err">❌ Không có thay đổi nào được áp dụng.</span><br>'+errors.join('<br>');win.document.getElementById('exportWord').disabled=true;win.document.getElementById('exportZip').disabled=true;return}
    const out=docs.filter(d=>d.xml!==undefined);const first=out[0];
    for(const d of out)d.z.file('word/document.xml',d.xml);
    window.__V44_DOCS__=out;
    win.document.getElementById('validator').innerHTML='<span class="good">✅ SAFE MUTATION PASS: '+applied+' thay đổi đã áp dụng.</span>'+(errors.length?'<br><span class="err">⚠️ '+errors.length+' mục bị chặn.</span><br>'+errors.join('<br>'):'')+'<br>Đã kiểm tra: paragraph · bảng · hình · section · nội dung ngoài vùng sửa.';
    win.document.getElementById('preview').textContent=out.map(d=>d.name+'\n\n'+textOf(new DOMParser().parseFromString(d.xml,'application/xml'))).join('\n\n');
    win.document.getElementById('exportWord').disabled=false;win.document.getElementById('exportZip').disabled=false;win.document.getElementById('exportHtml').disabled=false;win.document.getElementById('exportLog').disabled=false;
    win.document.getElementById('exportWord').onclick=async()=>{const d=first;const blob=await d.z.generateAsync({type:'blob'});download(blob,d.name.replace(/\.docx$/i,'')+'_DA_SUA.docx');win.document.getElementById('exportStatus').textContent='✅ Đã xuất Word sau Safe Mutation.'};
    win.document.getElementById('exportZip').onclick=async()=>{const z=new JSZip();for(const d of out)z.file(d.name,await d.z.generateAsync({type:'blob'}));download(await z.generateAsync({type:'blob'}),'GIAO_AN_DA_SUA_TUAN.zip');win.document.getElementById('exportStatus').textContent='✅ Đã xuất ZIP cả tuần.'};
    function download(blob,name){const a=win.document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;win.document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
  }catch(e){win.document.getElementById('validator').innerHTML='<span class="err">❌ Safe Mutation lỗi: '+String(e.message||e)+'</span>'}
}
function patch(win){if(!win||win.__V44_PATCHED__)return;win.__V44_PATCHED__=true;
  const origFetch=win.fetch.bind(win);win.fetch=async function(input,init){try{let url=typeof input==='string'?input:(input&&input.url)||'';if(/generativelanguage\.googleapis\.com/i.test(url)&&init?.body&&typeof init.body==='string'){const b=JSON.parse(init.body);if(b.generationConfig){delete b.generationConfig.responseSchema;b.generationConfig.responseMimeType='application/json'}if(/\/models\/gemini-2\.5-flash:/i.test(url))url=url.replace('gemini-2.5-flash','gemini-3.5-flash-lite');init={...init,body:JSON.stringify(b)}}return origFetch(url,init)}catch(e){return origFetch(input,init)}};
  const sel=win.document.getElementById('model');if(sel){sel.innerHTML=MODELS.map((m,i)=>'<option value="'+m+'">'+(i===0?'Gemini 3.7 Flash — khuyên dùng':i===1?'Gemini 3.6 Flash — mạnh và ổn định':'Gemini 3.5 Flash-Lite — dự phòng nhẹ')+'</option>').join('');sel.value='gemini-3.7-flash'}
  const apply=win.document.getElementById('apply');if(apply){apply.onclick=(e)=>{e.preventDefault();e.stopImmediatePropagation();applySafely(win)};}
  const title=win.document.querySelector('.sub');if(title)title.textContent='v4.4 · Safe DOCX Mutation + Cross-Run Anchor + 2-Layer Validator + Gemini Semantic Review + Export';
  const foot=win.document.querySelector('footer');if(foot)foot.textContent='🛠️ TRANG SỬA GIÁO ÁN · Lê Hoàng · v4.4 · Bản gốc không bị ghi đè · Safe Mutation ACTIVE.';
}
f.addEventListener('load',()=>{setTimeout(()=>patch(f.contentWindow),200);setTimeout(()=>patch(f.contentWindow),1000);});
})();
</script>
</body></html>
