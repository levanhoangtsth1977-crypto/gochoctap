<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(function(){'use strict';
const f=document.getElementById('app');
const MODELS=['gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash-lite'];
const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function textOf(doc){return Array.from(doc.getElementsByTagName('w:p')).map(p=>Array.from(p.getElementsByTagName('w:t')).map(t=>t.textContent||'').join('')).join('\n')}
function counts(xml){return{p:(xml.match(/<w:p\b/g)||[]).length,t:(xml.match(/<w:tbl\b/g)||[]).length,i:(xml.match(/<wp:inline\b/g)||[]).length,s:(xml.match(/<w:sectPr\b/g)||[]).length}}
function sha256(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''))}
function cloneRun(doc,run,txt){const r=run.cloneNode(true);Array.from(r.getElementsByTagName('w:t')).forEach(t=>t.parentNode.removeChild(t));const t=doc.createElementNS(W,'w:t');t.setAttribute('xml:space','preserve');t.textContent=txt;r.appendChild(t);return r}
function redRun(doc,txt){const r=doc.createElementNS(W,'w:r'),rp=doc.createElementNS(W,'w:rPr'),i=doc.createElementNS(W,'w:i'),c=doc.createElementNS(W,'w:color');c.setAttribute('w:val','C00000');rp.append(i,c);r.appendChild(rp);const t=doc.createElementNS(W,'w:t');t.setAttribute('xml:space','preserve');t.textContent=txt;r.appendChild(t);return r}
function replaceAcrossRuns(xml,anchor,repl){
 const d=new DOMParser().parseFromString(xml,'application/xml');if(d.getElementsByTagName('parsererror').length)return{ok:false,reason:'XML Word không hợp lệ.'};
 for(const p of Array.from(d.getElementsByTagName('w:p'))){
  const ts=Array.from(p.getElementsByTagName('w:t'));let full='';const map=[];
  for(const t of ts){const v=t.textContent||'';map.push({t,start:full.length,end:full.length+v.length,run:t.parentNode});full+=v}
  let at=full.indexOf(anchor);if(at<0)continue;if(full.indexOf(anchor,at+1)>=0)return{ok:false,reason:'Anchor trùng nhiều vị trí trong cùng đoạn.'};
  const end=at+anchor.length;const affected=map.filter(x=>x.end>at&&x.start<end);if(!affected.length)return{ok:false,reason:'Không ánh xạ được anchor.'};
  const first=affected[0].run,last=affected[affected.length-1].run;const runs=[...new Set(affected.map(x=>x.run))];
  if(runs.some(r=>Array.from(r.childNodes).some(n=>n.nodeType===1&&n.localName!=='rPr'&&n.localName!=='t')))return{ok:false,reason:'Anchor nằm trong run có cấu trúc đặc biệt; đã chặn.'};
  const before=full.slice(0,at),after=full.slice(end);const parent=first.parentNode;const pos=first;
  const beforeLocal=(first.getElementsByTagName('w:t')[0]?.textContent||'');const firstStart=affected[0].start;const lastStart=affected[affected.length-1].start;
  const beforeInFirst=at-firstStart;const afterInLast=end-lastStart;
  const firstAfter=(first===last)?after:((last.getElementsByTagName('w:t')[0]?.textContent||'').slice(afterInLast));
  const nodes=[];
  if(before)nodes.push(cloneRun(d,first,before));
  nodes.push(redRun(d,repl));
  if(first===last?after:firstAfter)nodes.push(cloneRun(d,last,first===last?after:firstAfter));
  parent.insertBefore(nodes[0],pos);for(let i=1;i<nodes.length;i++)parent.insertBefore(nodes[i],pos);for(const r of runs)if(r.parentNode===parent)parent.removeChild(r);
  return{ok:true,xml:new XMLSerializer().serializeToString(d),beforeText:full,afterText:before+repl+after};
 }
 return{ok:false,reason:'Không tìm thấy anchor trong DOCX.'};
}
function accepted(win){const box=win.document.getElementById('changes');if(!box)return[];return Array.from(box.querySelectorAll('.change')).filter(x=>/ĐÃ DUYỆT/.test(x.textContent||'')).map(x=>({id:x.querySelector('b')?.textContent||'',file:(x.textContent.match(/File:\s*([^\n]+?)(?:Lý do:|Đề xuất:|Cũ\/Anchor|Đề xuất$)/)||[])[1]?.trim()||'',anchor:x.querySelector('.old')?.textContent?.replace(/^Cũ\/Anchor\s*/,'').trim()||'',replacement:x.querySelector('.new')?.textContent?.replace(/^Đề xuất\s*/,'').trim()||''}));}
async function readInputs(win){const fs=Array.from(win.document.getElementById('files')?.files||[]),out=[];for(const file of fs){if(/\.docx$/i.test(file.name)){const z=await JSZip.loadAsync(await file.arrayBuffer()),e=z.file('word/document.xml');if(e)out.push({name:file.name,z,xml:await e.async('string')})}else if(/\.zip$/i.test(file.name)){const z=await JSZip.loadAsync(await file.arrayBuffer());for(const n of Object.keys(z.files)){if(z.files[n].dir||!/\.docx$/i.test(n))continue;const bz=await z.files[n].async('blob'),dz=await JSZip.loadAsync(await bz.arrayBuffer()),e=dz.file('word/document.xml');if(e)out.push({name:n.split('/').pop(),z:dz,xml:await e.async('string')})}}}return out}
function previewHtml(xml){const d=new DOMParser().parseFromString(xml,'application/xml');return Array.from(d.getElementsByTagName('w:p')).map(p=>{const parts=[];for(const r of Array.from(p.children).filter(x=>x.localName==='r')){const txt=Array.from(r.getElementsByTagName('w:t')).map(t=>t.textContent||'').join('');if(!txt)continue;const red=Array.from(r.getElementsByTagName('w:color')).some(c=>c.getAttribute('w:val')==='C00000'),it=r.getElementsByTagName('w:i').length>0;parts.push((red||it?'<span style="color:#c00000;font-style:italic">':'')+esc(txt)+(red||it?'</span>':''))}return '<div style="margin:0 0 7px">'+parts.join('')+'</div>'}).join('')}
function addAudit(win,rows){let box=win.document.getElementById('logPreview');if(!box)return;const old=box.innerHTML;const audit=rows.map(r=>'<tr><td>'+esc(r.time)+'</td><td>'+esc(r.file)+'</td><td>'+esc(r.id)+'</td><td>'+esc(r.oldHash.slice(0,12)+'…')+'</td><td>'+esc(r.newHash.slice(0,12)+'…')+'</td></tr>').join('');box.innerHTML='<h3>🔐 SHA-256 Audit</h3><table class="tablelike"><tr><th>Thời gian</th><th>File</th><th>ID</th><th>SHA-256 gốc</th><th>SHA-256 sau sửa</th></tr>'+audit+'</table>'+old}
async function apply(win){const cs=accepted(win);const validator=win.document.getElementById('validator');if(!cs.length){validator.innerHTML='<span class="err">❌ Chưa có Change Set được duyệt.</span>';return}validator.textContent='🔐 Transaction Mode: đang kiểm tra toàn bộ Change Set…';win.document.getElementById('apply').disabled=true;
 try{const docs=await readInputs(win),hashRows=[],errors=[],work=docs.map(d=>({...d,xml:d.xml}));
  for(const c of cs){const d=work.find(x=>x.name===c.file);if(!d){errors.push(c.id+': không tìm thấy file');continue}const before=d.xml,b=counts(before),r=replaceAcrossRuns(before,c.anchor,c.replacement);if(!r.ok){errors.push(c.id+': '+r.reason);continue}const a=counts(r.xml);if(JSON.stringify(b)!==JSON.stringify(a)){errors.push(c.id+': cấu trúc tài liệu thay đổi');continue}const pd=new DOMParser();const after=textOf(pd.parseFromString(r.xml,'application/xml')),expected=textOf(pd.parseFromString(before,'application/xml')).replace(c.anchor,c.replacement);if(after!==expected){errors.push(c.id+': Validator nội dung không khớp');continue}const [oldHash,newHash]=await Promise.all([sha256(before),sha256(r.xml)]);hashRows.push({time:new Date().toLocaleString('vi-VN'),file:d.name,id:c.id,oldHash,newHash});d.xml=r.xml;}
  if(errors.length){validator.innerHTML='<span class="err">❌ TRANSACTION ROLLBACK: '+errors.length+' lỗi. Không có thay đổi nào được ghi vào DOCX.</span><br>'+errors.map(esc).join('<br>');win.document.getElementById('exportWord').disabled=true;win.document.getElementById('exportZip').disabled=true;return}
  for(const d of work){if(d.xml!==d.z.file('word/document.xml'))d.z.file('word/document.xml',d.xml)}
  window.__V45__={docs:work,hashRows};
  validator.innerHTML='<span class="good">✅ VALIDATOR 3 LỚP PASS · TRANSACTION COMMIT · '+cs.length+' Change Set.</span><br>✓ Cấu trúc · ✓ Nội dung · ✓ SHA-256 Audit · ✓ Rollback an toàn';
  const pv=win.document.getElementById('preview');pv.innerHTML=work.map(d=>'<h3>'+esc(d.name)+'</h3>'+previewHtml(d.xml)).join('');addAudit(win,hashRows);
  win.document.getElementById('exportWord').disabled=false;win.document.getElementById('exportZip').disabled=false;win.document.getElementById('exportHtml').disabled=false;win.document.getElementById('exportLog').disabled=false;
  const dl=(blob,name)=>{const a=win.document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1200)};
  win.document.getElementById('exportWord').onclick=async()=>{const d=work[0];dl(await d.z.generateAsync({type:'blob'}),d.name.replace(/\.docx$/i,'')+'_DA_SUA.docx');win.document.getElementById('exportStatus').textContent='✅ Word đã xuất · Transaction Commit.'};
  win.document.getElementById('exportZip').onclick=async()=>{const z=new JSZip();for(const d of work)z.file(d.name,await d.z.generateAsync({type:'blob'}));dl(await z.generateAsync({type:'blob'}),'GIAO_AN_DA_SUA_TUAN.zip');win.document.getElementById('exportStatus').textContent='✅ ZIP đã xuất · '+work.length+' file.'};
  win.document.getElementById('exportLog').onclick=()=>{const csv=['Time,File,ID,SHA256_Before,SHA256_After',...hashRows.map(r=>[r.time,r.file,r.id,r.oldHash,r.newHash].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\n');dl(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'CHANGE_LOG_SHA256.csv');win.document.getElementById('exportStatus').textContent='✅ Đã xuất Change Log + SHA-256.'};
 }catch(e){validator.innerHTML='<span class="err">❌ Transaction lỗi: '+esc(e.message||e)+'</span>'}finally{win.document.getElementById('apply').disabled=false}}
function patch(win){if(!win||win.__V45_PATCHED__)return;win.__V45_PATCHED__=true;const origFetch=win.fetch.bind(win);win.fetch=async function(input,init){try{let url=typeof input==='string'?input:(input&&input.url)||'';if(/generativelanguage\.googleapis\.com/i.test(url)&&init?.body&&typeof init.body==='string'){const b=JSON.parse(init.body);if(b.generationConfig){delete b.generationConfig.responseSchema;b.generationConfig.responseMimeType='application/json'}if(/\/models\/gemini-2\.5-flash:/i.test(url))url=url.replace('gemini-2.5-flash','gemini-3.5-flash-lite');init={...init,body:JSON.stringify(b)}}return origFetch(url,init)}catch(e){return origFetch(input,init)}};
 const sel=win.document.getElementById('model');if(sel){sel.innerHTML=MODELS.map((m,i)=>'<option value="'+m+'">'+(i===0?'Gemini 3.7 Flash — khuyên dùng':i===1?'Gemini 3.6 Flash — mạnh và ổn định':'Gemini 3.5 Flash-Lite — dự phòng nhẹ')+'</option>').join('');sel.value=MODELS[0]}
 const applyBtn=win.document.getElementById('apply');if(applyBtn)applyBtn.onclick=e=>{e.preventDefault();e.stopImmediatePropagation();apply(win)};
 const sub=win.document.querySelector('.sub');if(sub)sub.textContent='v4.5 · Safe DOCX Mutation + Cross-Run Anchor + Validator 3 lớp + SHA-256 Audit + Transaction Rollback + Visual Preview';
 const foot=win.document.querySelector('footer');if(foot)foot.textContent='🛠️ TRANG SỬA GIÁO ÁN · Lê Hoàng · v4.5 VIP · Bản gốc không bị ghi đè · Transaction + SHA-256 ACTIVE.';
 const h=win.document.querySelector('h2');
}
f.addEventListener('load',()=>{setTimeout(()=>patch(f.contentWindow),200);setTimeout(()=>patch(f.contentWindow),1200)});
})();
</script>
