<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🛠️ TRANG SỬA GIÁO ÁN · v6.0 HOTFIX</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%}</style></head><body><iframe id="app" src="./v60.html?core=1&cb=202609012359"></iframe><script>
const f=document.getElementById('app');
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)};
function setFlow(n){try{const ds=f.contentDocument.querySelectorAll('#flow .step');ds.forEach((e,i)=>{e.classList.toggle('on',i===n-1);e.classList.toggle('done',i<n-1)})}catch{}}
function patch(){try{const d=f.contentDocument;if(!d||!d.getElementById('gemReview'))return;const q=id=>d.getElementById(id);const w=f.contentWindow;if(!w.__v60FetchPatched){const native=w.fetch.bind(w);w.fetch=async(input,init={})=>{const url=String(input);if(!/generativelanguage\.googleapis\.com\/v1beta\/models\/.*:generateContent/.test(url))return native(input,init);const body=String(init.body||'');const model=(url.match(/models\/([^:]+)/)||[])[1]||'model';const ck='v60-gem-cache-'+model+'-'+hash(body);try{const hit=w.sessionStorage.getItem(ck);if(hit)return new w.Response(hit,{status:200,headers:{'Content-Type':'application/json'}})}catch{}let last;for(let a=0;a<2;a++){const r=await native(input,init);if(r.ok){const txt=await r.text();try{w.sessionStorage.setItem(ck,txt)}catch{}return new w.Response(txt,{status:200,headers:{'Content-Type':'application/json'}})}const txt=await r.text();last=new w.Response(txt,{status:r.status,headers:r.headers});if(r.status!==429)return last;let sec=0,m=txt.match(/retry in\s+([0-9.]+)s/i);if(m)sec=Math.ceil(Number(m[1]));if(a===0&&sec>0&&sec<=90){q('gemStatus').textContent='⏳ Gemini 429 · chờ '+sec+' giây · chỉ thử lại 1 lần…';await new Promise(r=>setTimeout(r,sec*1000))}else break}return last};w.__v60FetchPatched=true}q('gemTest').onclick=async()=>{try{const k=q('gemKey').value.trim(),model=q('gemModel').value;if(!k)throw Error('Chưa nhập Gemini API Key.');q('gemStatus').textContent='⏳ Đang kiểm tra quyền truy cập Gemini…';const r=await w.fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model),{headers:{'x-goog-api-key':k}}),raw=await r.text();if(!r.ok)throw Error('Gemini '+r.status+': '+raw.slice(0,700));q('gemStatus').textContent='✅ API Key hợp lệ · '+model+' truy cập được. Kiểm tra không dùng generateContent quota.'}catch(e){q('gemStatus').textContent='❌ '+e.message}};q('gemReview').addEventListener('click',()=>setFlow(4));const obs=new MutationObserver(()=>{const t=q('gemStatus').textContent||'';if(/Gemini đã phân tích/i.test(t))setFlow(5);if(/Validator đạt/i.test(q('validator').textContent||''))setFlow(6);if(/Đã xuất/i.test(q('out').textContent||''))setFlow(7)});obs.observe(q('gemStatus'),{childList:true,subtree:true,characterData:true});obs.observe(q('validator'),{childList:true,subtree:true,characterData:true});obs.observe(q('out'),{childList:true,subtree:true,characterData:true});q('apply').addEventListener('click',()=>setTimeout(()=>setFlow(6),100));q('word').addEventListener('click',()=>setFlow(7));q('zip').addEventListener('click',()=>setFlow(7));}catch(e){setTimeout(patch,300)}}
f.addEventListener('load',()=>setTimeout(patch,500));setTimeout(patch,2500);
</script></body></html>
