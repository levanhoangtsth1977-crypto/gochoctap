<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>🛠️ CÔNG CỤ RIÊNG · GIÁO VIÊN · TRANG SỬA GIÁO ÁN</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" title="Trang Sửa Giáo Án"></iframe><script>(function(){'use strict';var f=document.getElementById('app');var MODELS=['gemini-3.8-flash','gemini-3.7-flash','gemini-3.6-flash'];function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}function child(){return f.contentWindow;}function setStatus(t){try{var d=f.contentDocument,g=d&&d.getElementById('gemStatus');if(g)g.textContent=t;}catch(e){}}function fallbackUrl(url,model){return url.replace(/\/models\/[^/:]+(?=:generateContent)/i,'/models/'+model);}function report(){try{var d=f.contentDocument;if(!d)return;var box=d.getElementById('stableSubjectReport');if(!box){box=d.createElement('div');box.id='stableSubjectReport';box.className='st';box.style.marginTop='8px';var r=d.getElementById('report');if(r&&r.parentNode)r.parentNode.appendChild(box);else return;}var labels={LICH_SU_DIA_LI:'Lịch sử - Địa lí',DAO_DUC:'Đạo đức',TOAN:'Toán',TIENG_VIET:'Tiếng Việt',KHOA_HOC:'Khoa học',CONG_NGHE:'Công nghệ',HDTN:'Hoạt động trải nghiệm'};var selected=[].slice.call(d.querySelectorAll('.sub:checked')).map(function(x){return x.value});var cards=[].slice.call(d.querySelectorAll('#changes .change'));var lines=['📊 BÁO CÁO THEO TỪNG MÔN'];selected.forEach(function(s){var n=0,g=0;cards.forEach(function(c){var t=(c.textContent||'').replace(/\s+/g,' ');if(t.indexOf('· '+labels[s]+' ·')>=0){n++;if(t.indexOf('GEM-')>=0)g++;}});lines.push('• '+labels[s]+': Rule '+(n-g)+' · Gemini '+g+' · Tổng '+n);});lines.push('• Tổng Change Set: '+cards.length);box.textContent=lines.join('\n');}catch(e){}}function patchChild(){try{var w=child(),d=w.document;if(!d)return;if(typeof w.xmlText!=='function'){w.xmlText=function(xml){var x=new w.DOMParser().parseFromString(String(xml||''),'application/xml');if(x.getElementsByTagName('parsererror').length)throw new Error('XML không hợp lệ');return x.documentElement?(x.documentElement.textContent||''):'';};}if(w.fetch&&!w.__stableGeminiFetch){var nativeFetch=w.fetch.bind(w);w.__stableGeminiFetch=true;w.fetch=async function(input,init){var url=typeof input==='string'?input:(input&&input.url)||'';if(!/generativelanguage\.googleapis\.com\/v1beta\/models\/[^/]+:generateContent/i.test(url))return nativeFetch(input,init);var selected=(url.match(/\/models\/([^/:]+):generateContent/i)||[])[1]||MODELS[0];var order=[selected].concat(MODELS.filter(function(m){return m!==selected;}));var last=null;for(var mi=0;mi<order.length;mi++){var model=order[mi],target=fallbackUrl(url,model);for(var attempt=0;attempt<3;attempt++){try{if(mi>0&&attempt===0)setStatus('⏳ '+selected+' tạm bận · chuyển '+model+'…');var res=await nativeFetch(target,init);last=res;if(res.status!==503&&res.status!==429&&res.status!==500)return res;if(attempt<2)await sleep(800*(attempt+1));}catch(e){if(mi===order.length-1&&attempt===2)throw e;if(attempt<2)await sleep(800*(attempt+1));}}}setStatus('❌ Gemini tạm thời không khả dụng · HTTP '+(last?last.status:'503'));return last;};}report();if(d.getElementById('changes')&&!w.__stableObserver){w.__stableObserver=new w.MutationObserver(report);w.__stableObserver.observe(d.getElementById('changes'),{childList:true,subtree:true,characterData:true});}}catch(e){setStatus('❌ Runtime ổn định: '+e.message);}}f.src='./v64.html?stable=final&cb='+Date.now();f.addEventListener('load',function(){patchChild();setTimeout(patchChild,100);setTimeout(patchChild,500);setTimeout(patchChild,1200);});})();</script></body></html>
