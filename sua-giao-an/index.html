<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>🛠️ Trang Sửa Giáo Án · v6.0 MASTER CLEAN</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" title="Trang Sửa Giáo Án v6.0" src="./v60.html?v=6.0&cb=202609020530"></iframe><script>(()=>{const get=()=>document.getElementById('app');const boot=()=>{const f=get();if(!f||!f.contentDocument)return;const d=f.contentDocument;const q=s=>d.querySelector(s),qa=s=>[...d.querySelectorAll(s)];const v=q('#validator'),p=q('#preview'),a=q('#audit'),c=q('#changes'),apply=q('#apply'),word=q('#word'),zip=q('#zip'),log=q('#log'),bulk=q('#bulkStatus');if(!v||!p||!c)return;const addAudit=t=>{if(!a)return;const line=new Date().toLocaleString('vi-VN')+' · '+t;if(!a.textContent.includes(line))a.textContent=(a.textContent&&a.textContent!=='Audit log.'?a.textContent+'\n':'')+line};const refresh=()=>{const cards=qa('#changes .change');const approved=cards.filter(x=>x.classList.contains('approved')).length;const rejected=cards.filter(x=>x.classList.contains('rejected')).length;const applied=Number(q('#aa')?.textContent||0);v.textContent=cards.length?`🛡️ Validator · Tổng ${cards.length} · Đã duyệt ${approved} · Từ chối ${rejected} · ${applied>0?'✅ Đã áp dụng và đang kiểm tra sau sửa.':approved?'✅ Sẵn sàng áp dụng.':'⚠️ Chưa có Change Set được duyệt.'}`:'🛡️ Validator · Chưa có Change Set để kiểm tra.';if(apply)apply.disabled=approved===0||applied>0;if(log)log.disabled=cards.length===0;if(applied>0){if(word)word.disabled=false;if(zip)zip.disabled=false}};const preview=()=>{const cards=qa('#changes .change');if(cards.length){p.textContent=cards.map((x,i)=>'#'+(i+1)+'\n'+x.innerText.trim()).join('\n\n')}else{p.textContent='Chưa có Change Set.'}};const wire=()=>{qa('#changes [data-a],#changes [data-r],#high,#all,#none').forEach(b=>{if(b.dataset.inlineBridge)return;b.dataset.inlineBridge='1';b.addEventListener('click',()=>setTimeout(()=>{refresh();preview();addAudit(b.textContent.trim())},120),true)});if(apply&&!apply.dataset.inlineBridge){apply.dataset.inlineBridge='1';apply.addEventListener('click',()=>setTimeout(()=>{refresh();preview();addAudit('Áp dụng Change Set và kiểm tra sau sửa.')},200),true)}const vb=q('#validateNow');if(vb&&!vb.dataset.inlineBridge){vb.dataset.inlineBridge='1';vb.addEventListener('click',()=>{refresh();addAudit('Chạy Validator.')},true)}const pb=q('#previewNow');if(pb&&!pb.dataset.inlineBridge){pb.dataset.inlineBridge='1';pb.addEventListener('click',()=>{preview();addAudit('Cập nhật Preview.')},true)}};wire();refresh();preview();new MutationObserver(()=>{wire();refresh()}).observe(c,{subtree:true,childList:true,attributes:true,attributeFilter:['class']})};window.addEventListener('load',()=>{boot();setInterval(boot,700)});})();</script></body></html>
