<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>🛠️ Trang Sửa Giáo Án · v6.0 MASTER CLEAN</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" title="Trang Sửa Giáo Án v6.0" src="./v60.html?v=6.0&cb=202609020915"></iframe><script>(()=>{'use strict';const get=()=>document.getElementById('app');const boot=()=>{const f=get();if(!f||!f.contentDocument)return;const d=f.contentDocument;const q=s=>d.querySelector(s),qa=s=>[...d.querySelectorAll(s)];const v=q('#validator'),p=q('#preview'),a=q('#audit'),c=q('#changes'),apply=q('#apply'),word=q('#word'),zip=q('#zip'),log=q('#log'),bulk=q('#bulkStatus'),out=q('#out');if(!v||!p||!c)return;const cards=()=>qa('#changes .change');const approved=()=>cards().filter(x=>x.classList.contains('approved')).length;const rejected=()=>cards().filter(x=>x.classList.contains('rejected')).length;const applied=()=>Number(q('#aa')?.textContent||0);const addAudit=t=>{if(!a)return;const line=new Date().toLocaleString('vi-VN')+' · '+t;const old=a.textContent||'';if(!old.split('\n').includes(line))a.textContent=(old&&old!=='Audit log.'?old+'\n':'')+line};const setStep=n=>{qa('#flow .step').forEach((e,i)=>{e.classList.toggle('on',i===n-1);e.classList.toggle('done',i<n-1)})};const refresh=()=>{const t=cards().length,ap=approved(),rj=rejected(),done=applied();if(!t){v.textContent='🛡️ Validator · Chưa có Change Set để kiểm tra.';if(out)out.textContent='⏳ Chưa có Change Set đã áp dụng. Hãy nạp → quét → Gemini.';return}if(done>0){v.textContent=`✅ Validator sau áp dụng · Tổng ${t} · Đã duyệt ${ap} · Từ chối ${rj} · Đã sửa ${done}`;if(out)out.textContent='✅ Bản làm việc đã được sửa và kiểm tra. Có thể xuất Word/ZIP.';if(log)log.disabled=false;setStep(7)}else if(ap>0){v.textContent=`🛡️ Preflight · Tổng ${t} · Đã duyệt ${ap} · Từ chối ${rj} · ✅ Sẵn sàng ÁP DỤNG`;if(bulk)bulk.textContent=`✅ Có ${ap} Change Set đã duyệt. Bây giờ bấm ✏️ ÁP DỤNG ĐÃ DUYỆT.`;if(out)out.textContent='➡️ Đã duyệt nhưng chưa áp dụng. Bấm “✏️ ÁP DỤNG ĐÃ DUYỆT” để sửa DOCX; sau khi Validator đạt, Word/ZIP sẽ tự mở.';if(apply)apply.disabled=false;setStep(6)}else{v.textContent=`🔎 Validator · Tổng ${t} · Chưa duyệt ${t-rj}`;if(out)out.textContent='⏳ Chưa có Change Set được duyệt.';setStep(5)}};const preview=()=>{const arr=cards();p.textContent=arr.length?arr.map((x,i)=>'#'+(i+1)+'\n'+x.innerText.trim()).join('\n\n'):'Chưa có Change Set.'};const wire=()=>{qa('#changes [data-a],#changes [data-r],#high,#all,#none').forEach(b=>{if(b.dataset.inlineBridge)return;b.dataset.inlineBridge='1';b.addEventListener('click',()=>setTimeout(()=>{refresh();preview();addAudit(b.textContent.trim())},180),true)});if(apply&&!apply.dataset.inlineBridge){apply.dataset.inlineBridge='1';apply.addEventListener('click',()=>{if(bulk)bulk.textContent='⏳ Đang áp dụng Change Set đã duyệt…';if(v)v.textContent='⏳ APPLY đang sửa tài liệu làm việc…';setTimeout(()=>{refresh();preview();addAudit('Áp dụng Change Set đã duyệt; kiểm tra sau sửa.')},900)},true)}if(log&&!log.dataset.inlineBridge){log.dataset.inlineBridge='1';log.addEventListener('click',()=>addAudit('Mở Change Log.'))}};wire();refresh();preview();new MutationObserver(()=>{wire();refresh()}).observe(c,{subtree:true,childList:true,attributes:true,attributeFilter:['class','disabled']})};window.addEventListener('load',()=>{boot();setInterval(boot,1000)});})();</script></body></html>
