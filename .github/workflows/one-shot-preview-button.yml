name: Final Apply Export Repair
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-preview-button.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'FINAL-APPLY-EXPORT-REPAIRED')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair v64 Apply and Export
        shell: python
        run: |
          from pathlib import Path
          p=Path('sua-giao-an/v64.html')
          s=p.read_text(encoding='utf-8')

          a=s.find('function applyOne(c){')
          b=s.find('function validate(){',a)
          if a<0 or b<0: raise SystemExit('applyOne markers not found')
          fn="""function applyOne(c){const d=S.docs.find(x=>x.name===c.file);if(!d)throw Error(c.id+': thiếu file');const part=c.path||'word/document.xml';if(!d.parts[part])throw Error(c.id+': thiếu XML part');if(c.type==='INTEGRATION'){d.parts[part]=appendIntegration(d.parts[part],c.new)}else{const dom=parse(d.parts[part]),ps=[...dom.getElementsByTagNameNS(NS,'p')];let target=c.paragraph>0?ps[c.paragraph-1]:null;if(c.old&&(!target||!norm(target.textContent||'').includes(norm(c.old))))target=ps.find(q=>norm(q.textContent||'').includes(norm(c.old)));if(!target||!c.old||!replaceExact(target,c.old,c.new))throw Error(c.id+': không tìm thấy OLD trong DOCX');d.parts[part]=new XMLSerializer().serializeToString(dom)}c.status='applied'}"""
          s=s[:a]+fn+s[b:]

          # Replace the existing post-check loop by boundary, not by exact whitespace.
          a=s.find("for(const c of S.changes.filter(x=>x.status==='applied'")
          b=s.find("S.exportReady=true;",a)
          if a<0 or b<0: raise SystemExit('post-check boundary not found')
          post="for(const c of S.changes.filter(x=>x.status==='applied')){const d=S.docs.find(d=>d.name===c.file);const xml=d?.parts?.[c.path||'word/document.xml'];if(!xml)throw Error(c.id+': Post-Validator thiếu XML');if(!xmlText(xml).includes(c.new))throw Error(c.id+': Post-Validator không thấy NEW trong DOCX')}"
          s=s[:a]+post+s[b:]

          s=s.replace('function dl(blob,name){function dl(blob,name){','function dl(blob,name){',1)
          if 'previewExportBtn' not in s: raise SystemExit('preview button missing')
          if s.count("$('word').addEventListener")!=1: raise SystemExit('word handler invalid')
          if s.count("$('zip').addEventListener")!=1: raise SystemExit('zip handler invalid')
          if s.count("$('log').addEventListener")!=1: raise SystemExit('log handler invalid')
          if 'parseXml(' in s: raise SystemExit('legacy parseXml remains')
          p.write_text(s,encoding='utf-8')
      - name: Validate repaired source
        shell: python
        run: |
          from pathlib import Path
          s=Path('sua-giao-an/v64.html').read_text(encoding='utf-8')
          tests=[
            'let target=c.paragraph>0?ps[c.paragraph-1]:null;' in s,
            "filter(x=>x.status==='applied')){" in s,
            'function dl(blob,name){function dl(blob,name){' not in s,
            s.count("$('word').addEventListener")==1,
            s.count("$('zip').addEventListener")==1,
            s.count("$('log').addEventListener")==1,
            'previewExportBtn' in s,
            'parseXml(' not in s,
            'function parse(x)' in s,
            'function xmlText(x)' in s,
          ]
          print(tests)
          if not all(tests): raise SystemExit('FINAL VALIDATE FAIL')
      - name: Commit repaired v64
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sua-giao-an/v64.html
          git commit -m 'FINAL-APPLY-EXPORT-REPAIRED'
          git push
      - name: Remove one-shot workflow
        run: |
          git rm -f .github/workflows/one-shot-preview-button.yml
          git commit -m 'chore: remove final apply export workflow'
          git push