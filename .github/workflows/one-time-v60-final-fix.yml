name: One-time V60 Final Fix
on:
  push:
    paths:
      - .github/v60-final-fix-trigger.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v60 directly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sua-giao-an/v60.html')
          s=p.read_text(encoding='utf-8')
          marker='data-v60-final-validator="1"'
          if marker not in s:
            inject='''<script data-v60-final-validator="1">(()=>{const H='Validator + Preview + Audit';const $=id=>document.getElementById(id);const section=[...document.querySelectorAll('section')].find(x=>(x.querySelector('h2')?.textContent||'').includes(H));if(!section)return;const validator=$('validator'),preview=$('preview'),audit=$('audit'),changes=$('changes'),apply=$('apply'),word=$('word'),zip=$('zip'),log=$('log'),bulk=$('bulkStatus');let last='';function add(t){if(!audit)return;const v=new Date().toLocaleString('vi-VN')+' · '+t;if(v===last)return;last=v;audit.textContent=(audit.textContent&&audit.textContent!=='Audit log.'?audit.textContent+'\\n':'')+v}function refresh(){const cards=[...document.querySelectorAll('.change')];const approved=cards.filter(x=>x.classList.contains('approved')).length;const rejected=cards.filter(x=>x.classList.contains('rejected')).length;const total=cards.length;validator.textContent=total?`🛡️ Validator · Tổng ${total} · Đã duyệt ${approved} · Từ chối ${rejected} · ${approved?'✅ Sẵn sàng áp dụng.':'⚠️ Chưa có Change Set được duyệt.'}`:'🛡️ Validator · Chưa có Change Set để kiểm tra.';if(apply)apply.disabled=approved===0;const aa=Number($('aa')?.textContent||0);if(aa>0){validator.textContent=`✅ Validator sau áp dụng · Đã ghi ${aa} thay đổi vào bản làm việc.`;if(word)word.disabled=false;if(zip)zip.disabled=false}if(log)log.disabled=total===0;return{total,approved,rejected,aa}}function previewPlan(){const cards=[...document.querySelectorAll('.change')];if(!cards.length){preview.textContent='Chưa có Change Set.';return}preview.textContent=cards.map((c,i)=>{const t=c.innerText.replace(/\\n+/g,'\\n').trim();return `#${i+1}\\n${t}`}).join('\\n\\n');}if(!section.querySelector('#validateNow')){const b=document.createElement('button');b.id='validateNow';b.className='btn y';b.textContent='🛡️ CHẠY VALIDATOR';section.insertBefore(b,validator);b.onclick=()=>{refresh();add('Chạy Validator.')}}if(!section.querySelector('#previewNow')){const b=document.createElement('button');b.id='previewNow';b.className='btn i';b.textContent='👁️ CẬP NHẬT PREVIEW';section.insertBefore(b,validator);b.onclick=()=>{previewPlan();add('Cập nhật Preview.')}}const mo=new MutationObserver(()=>{const r=refresh();previewPlan();const status=(bulk?.textContent||'');if(status.includes('Đã duyệt'))add(status)});mo.observe(changes||document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});apply?.addEventListener('click',()=>setTimeout(()=>{const r=refresh();if(r.aa>0)add('Áp dụng '+r.aa+' Change Set; Validator sau sửa đã chạy.');},150));[...document.querySelectorAll('[data-a],[data-r],#high,#all,#none')].forEach(b=>b.addEventListener('click',()=>setTimeout(()=>{refresh();previewPlan();add(b.textContent.trim())},80)));refresh();})();</script>'''
            s=s.replace('</body>',inject+'</body>')
          p.write_text(s,encoding='utf-8')
          print('FINAL_PATCHED', marker in s)
          PY
      - name: Verify final patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('sua-giao-an/v60.html').read_text(encoding='utf-8')
          required=['data-v60-final-validator="1"','id="validateNow"','id="previewNow"','Validator sau áp dụng','Áp dụng ']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('FINAL_PATCH_MISSING: '+', '.join(missing))
          for bad in ['value="TIENG_ANH"','value="TIN_HOC"','value="MI_THUAT"','value="AM_NHAC"']:
              if bad in s: raise SystemExit('LEGACY_SUBJECT: '+bad)
          js=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/final-v60.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/final-v60.js
      - name: Commit
        run: |
          git config user.name 'v60-final-fix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sua-giao-an/v60.html
          git commit -m 'fix(v60): finalize validator preview audit flow' || exit 0
          git push
