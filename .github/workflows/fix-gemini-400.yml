name: Final Apply Export Repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gemini-400.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'fix(sua-giao-an): final apply export repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v64 apply and export
        shell: python
        run: |
          from pathlib import Path
          p=Path('sua-giao-an/v64.html')
          s=p.read_text(encoding='utf-8')
          old="function applyOne(c){const d=S.docs.find(x=>x.name===c.file);if(!d)throw Error(c.id+': thiếu file');if(c.type==='INTEGRATION')d.parts[c.path]=appendIntegration(d.parts[c.path],c.new);else{const dom=parse(c.path?d.parts[c.path]:d.parts['word/document.xml']),p=[...dom.getElementsByTagNameNS(NS,'p')][(c.paragraph||1)-1];if(!p||!replaceExact(p,c.old,c.new))throw Error(c.id+': không tìm thấy OLD đúng paragraph');d.parts[c.path]=new XMLSerializer().serializeToString(dom)}c.status='applied'}"
          new="function applyOne(c){const d=S.docs.find(x=>x.name===c.file);if(!d)throw Error(c.id+': thiếu file');if(c.type==='INTEGRATION'){d.parts[c.path||'word/document.xml']=appendIntegration(d.parts[c.path||'word/document.xml'],c.new)}else{const path=c.path||'word/document.xml';const dom=parse(d.parts[path]);const ps=[...dom.getElementsByTagNameNS(NS,'p')];let p=c.paragraph>0?ps[c.paragraph-1]:null;if(c.old&&(!p||!norm(p.textContent).includes(norm(c.old))))p=ps.find(q=>norm(q.textContent).includes(norm(c.old)));if(!p||!c.old||!replaceExact(p,c.old,c.new))throw Error(c.id+': không tìm thấy OLD để thay thế');d.parts[path]=new XMLSerializer().serializeToString(dom)}c.status='applied'}"
          if old not in s: raise SystemExit('applyOne marker not found')
          s=s.replace(old,new,1)
          old2="for(const c of S.changes.filter(x=>x.status==='applied'&&x.type==='REPLACE'))if(!xmlText(S.docs.find(d=>d.name===c.file).parts[c.path]).includes(c.new))throw Error(c.id+': Post-Validator không thấy NEW');"
          new2="for(const c of S.changes.filter(x=>x.status==='applied')){const d=S.docs.find(d=>d.name===c.file);const text=xmlText(d.parts[c.path||'word/document.xml']);if(!text.includes(c.new))throw Error(c.id+': Post-Validator không thấy NEW trong DOCX')}"
          if old2 not in s: raise SystemExit('post validator marker not found')
          s=s.replace(old2,new2,1)
          old3="function dl(blob,name){function dl(blob,name){"
          if old3 not in s: raise SystemExit('duplicate dl marker not found')
          s=s.replace(old3,"function dl(blob,name){",1)
          p.write_text(s,encoding='utf-8')
          assert 'function dl(blob,name){function dl(blob,name){' not in s
          assert "let p=c.paragraph>0?ps[c.paragraph-1]:null" in s
          assert "filter(x=>x.status==='applied')){const d=S.docs.find" in s
          print('PATCH PASS',len(s))
      - name: Validate source
        shell: python
        run: |
          from pathlib import Path
          s=Path('sua-giao-an/v64.html').read_text(encoding='utf-8')
          required=["function applyOne(c){","let p=c.paragraph>0?ps[c.paragraph-1]:null","filter(x=>x.status==='applied')){const d=S.docs.find","function dl(blob,name){const"]
          for x in required: assert x in s, x
          assert 'function dl(blob,name){function dl(blob,name){' not in s
          assert s.count("$('word').addEventListener('click'") == 1
          print('VALIDATE PASS')
      - name: Commit patched v64
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sua-giao-an/v64.html
          git commit -m 'fix(sua-giao-an): final apply export repair'
          git push