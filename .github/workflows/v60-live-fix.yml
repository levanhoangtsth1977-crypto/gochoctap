name: V60 CI
on:
  push:
    paths:
      - sua-giao-an/v60.html
      - sua-giao-an/index.html
      - sua-giao-an/SPEC.md
      - sua-giao-an/*.json
      - sua-giao-an/tests/**
      - .github/workflows/v60-live-fix.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate single V60 runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          v=Path('sua-giao-an/v60.html').read_text(encoding='utf-8')
          i=Path('sua-giao-an/index.html').read_text(encoding='utf-8')
          forbidden=('gemini-2.5-flash','value="TIENG_ANH"','value="TIN_HOC"','value="MI_THUAT"','value="AM_NHAC"','v60-hotfix','v60-ui-bridge','document-engine-bridge','subject-picker.js','backend/','sua-giao-an/api/','v60-clean.html')
          for bad in forbidden:
              if bad in v or bad in i: raise SystemExit('FORBIDDEN:'+bad)
          for fn in ('parseGeminiJSON','gemCall','replaceInParagraph','findCurrentAnchor','resolveDoc'):
              n=len(re.findall(r'(?:function|async function) '+re.escape(fn)+r'\(',v))
              if n!=1: raise SystemExit(f'FUNCTION_COUNT:{fn}:{n}')
          for expr in ("$('files').addEventListener('change'", "document.querySelectorAll('.subjectCheck').forEach", "$('scan').onclick=", "$('gemReview').onclick=", "$('apply').onclick=", "$('word').onclick=", "$('zip').onclick="):
              if expr not in v: raise SystemExit('MISSING_RUNTIME_WIRING:'+expr)
          if '<iframe' in i or 'contentDocument' in i: raise SystemExit('LEGACY_INDEX_BRIDGE')
          if 'v60.html' not in i or 'v60-clean.html' in i: raise SystemExit('ENTRYPOINT_INVALID')
          if 'gemini-3.7-flash' not in v or 'gemini-3.6-flash' not in v: raise SystemExit('GEMINI_SELECTOR_INVALID')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',v,re.S)
          if len(scripts)!=2: raise SystemExit(f'SCRIPT_COUNT:{len(scripts)}')
          js=scripts[-1]
          Path('/tmp/v60.js').write_text(js,encoding='utf-8')
          if 'FF0000' not in js or 'w:i' not in js: raise SystemExit('RED_ITALIC_MARKUP_MISSING')
          if 'RUNTIME_CANONICAL' not in js: raise SystemExit('CANONICAL_ADMIN_RULES_MISSING')
          if '34 đơn vị hành chính cấp tỉnh' not in js or '7 thành phố trực thuộc Trung ương' not in js: raise SystemExit('ADMIN_2026_RULES_MISSING')
          if 'huyện Ngọc Hiển' not in js or 'xã Đất Mũi, tỉnh Cà Mau' not in js: raise SystemExit('DAT_MUI_RULE_MISSING')
          print('V60_SINGLE_RUNTIME_OK')
          PY
          node --check /tmp/v60.js
      - name: Validate required data package
        run: |
          for f in sua-giao-an/SPEC.md sua-giao-an/format-standard.json sua-giao-an/administrative-standard-2026-2027.json sua-giao-an/special-administrative-zones-2026-2027.json sua-giao-an/curriculum-adjustments-2026-2027.json sua-giao-an/integration-library-2026-2027.json sua-giao-an/master-adjustments-2026-2027.json; do test -f "$f" || exit 1; done
          echo DATA_PACKAGE_OK
