name: V60 CI
on:
  push:
    paths:
      - sua-giao-an/v60.html
      - sua-giao-an/index.html
      - sua-giao-an/SPEC.md
      - sua-giao-an/*.json
      - sua-giao-an/tests/**
      - .github/workflows/v60-live-fix.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V60 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          v=Path('sua-giao-an/v60.html').read_text(encoding='utf-8')
          i=Path('sua-giao-an/index.html').read_text(encoding='utf-8')
          for bad in ('gemini-2.5-flash','value="TIENG_ANH"','value="TIN_HOC"','value="MI_THUAT"','value="AM_NHAC"'):
              if bad in v: raise SystemExit('FORBIDDEN:'+bad)
          for fn in ('parseGeminiJSON','runGemini','__v60SafeXmlEdit'):
              n=len(re.findall(r'function '+re.escape(fn)+r'\(',v))
              if n!=1: raise SystemExit(f'DUPLICATE_OR_MISSING:{fn}:{n}')
          for expr in ("$('apply').onclick=","$('word').onclick=","$('zip').onclick="):
              if v.count(expr)!=1: raise SystemExit('HANDLER_COUNT:'+expr)
          if '<iframe' in i or 'contentDocument' in i: raise SystemExit('LEGACY_BRIDGE_IN_INDEX')
          if 'v60-hotfix' in i or 'v60-ui-bridge' in i or 'document-engine-bridge' in i: raise SystemExit('LEGACY_BRIDGE_REFERENCE')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',v,re.S)
          if not scripts: raise SystemExit('NO_INLINE_SCRIPT')
          Path('/tmp/v60.js').write_text(max(scripts,key=len),encoding='utf-8')
          print('V60_SOURCE_OK')
          PY
          node --check /tmp/v60.js
      - name: Validate required data files
        shell: bash
        run: |
          for f in \
            sua-giao-an/SPEC.md \
            sua-giao-an/format-standard.json \
            sua-giao-an/administrative-standard-2026-2027.json \
            sua-giao-an/special-administrative-zones-2026-2027.json \
            sua-giao-an/curriculum-adjustments-2026-2027.json \
            sua-giao-an/integration-library-2026-2027.json; do
            test -f "$f" || { echo "MISSING:$f"; exit 1; }
          done
          echo DATA_FILES_OK
