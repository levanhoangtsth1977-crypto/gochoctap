name: V60 Live Fix
on:
  push:
    paths:
      - .github/v60-live-fix-trigger.txt
      - .github/workflows/v60-live-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply stable master patch
        run: python3 .github/scripts/patch-v60-master.py
      - name: Deduplicate approved Change Sets
        run: python3 .github/scripts/dedupe-v60.py
      - name: Apply transactional APPLY
        run: python3 .github/scripts/transactional-apply.py
      - name: Hard-lock export bridge
        run: python3 .github/scripts/lock-export-bridge.py
      - name: Validate final source and export gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          v=Path('sua-giao-an/v60.html').read_text(encoding='utf-8')
          i=Path('sua-giao-an/index.html').read_text(encoding='utf-8')
          for bad in ('value="TIENG_ANH"','value="TIN_HOC"','value="MI_THUAT"','value="AM_NHAC"'):
              if bad in v: raise SystemExit('EXCLUDED_SUBJECT_PRESENT: '+bad)
          required_v=('data-v60-dedupe-approved="1"','exportReady','TRANSACTION')
          for marker in required_v:
              if marker not in v: raise SystemExit('V60_REQUIRED_MARKER_MISSING: '+marker)
          if 'word.disabled=false' in i or 'zip.disabled=false' in i:
              raise SystemExit('BRIDGE_MUST_NOT_UNLOCK_EXPORT')
          if 'word.disabled=false' in v or 'zip.disabled=false' not in v:
              raise SystemExit('V60_EXPORT_HANDLER_CHECK')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',v,re.S)
          if not scripts: raise SystemExit('NO_INLINE_SCRIPT')
          Path('/tmp/v60.js').write_text(max(scripts,key=len),encoding='utf-8')
          print('V60_SOURCE_CHECK_OK')
          PY
          node --check /tmp/v60.js
      - name: Require real v60/index change
        run: |
          if git diff --quiet -- sua-giao-an/v60.html sua-giao-an/index.html; then
            echo 'ERROR: no application files changed.'
            exit 1
          fi
      - name: Commit
        run: |
          git config user.name 'v60-authoritative-fix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sua-giao-an/v60.html sua-giao-an/index.html
          git commit -m 'fix(v60): transactional apply and hard export gate'
          git push
