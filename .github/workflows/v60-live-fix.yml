name: V60 Live Fix
on:
  push:
    paths:
      - .github/v60-live-fix-trigger.txt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply stable master patch
        run: python3 .github/scripts/patch-v60-master.py
      - name: Deduplicate approved Change Sets
        run: python3 .github/scripts/dedupe-v60.py
      - name: Validate final v60 source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('sua-giao-an/v60.html').read_text(encoding='utf-8')
          for bad in ('value="TIENG_ANH"','value="TIN_HOC"','value="MI_THUAT"','value="AM_NHAC"'):
              if bad in s: raise SystemExit('EXCLUDED_SUBJECT_PRESENT: '+bad)
          if 'data-v60-dedupe-approved="1"' not in s: raise SystemExit('DEDUPE_PATCH_MISSING')
          if s.count('function parseGeminiJSON(')>1: raise SystemExit('DUPLICATE_PARSE_GEMINI_JSON')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('NO_INLINE_SCRIPT')
          Path('/tmp/v60.js').write_text(max(scripts,key=len),encoding='utf-8')
          print('V60_SOURCE_CHECK_OK')
          PY
          node --check /tmp/v60.js
      - name: Require real v60 change
        run: |
          if git diff --quiet -- sua-giao-an/v60.html; then
            echo 'ERROR: v60.html was not changed.'
            exit 1
          fi
      - name: Commit
        run: |
          git config user.name 'v60-authoritative-fix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sua-giao-an/v60.html
          git commit -m 'fix(v60): stable approve apply export flow'
          git push