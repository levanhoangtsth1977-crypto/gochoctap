name: Fix parseXml v64
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace stale parseXml calls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sua-giao-an/v64.html')
          s=p.read_text(encoding='utf-8')
          before=s.count('parseXml(')
          s=s.replace('parseXml(', 'parse(')
          after=s.count('parseXml(')
          p.write_text(s, encoding='utf-8')
          assert before > 0, 'No stale parseXml call found'
          assert after == 0, f'Remaining parseXml calls: {after}'
          print(f'Replaced {before} stale parseXml calls')
          PY
      - name: Validate source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('sua-giao-an/v64.html').read_text(encoding='utf-8')
          assert 'function parse(' in s
          assert 'parseXml(' not in s
          assert 'previewExportBtn' in s
          assert 'previewBtn' in s
          assert 'word' in s
          print('v64 validation PASS')
          PY
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'fix(sua-giao-an): unify XML parser call'
          file_pattern: 'sua-giao-an/v64.html'
