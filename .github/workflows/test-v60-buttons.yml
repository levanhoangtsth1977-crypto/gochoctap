name: test-v60-buttons
on:
  push:
    paths:
      - '.github/workflows/test-v60-buttons.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm init -y >/dev/null 2>&1 && npm install --no-save playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Create DOCX fixture
        run: |
          python - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          xml='''<?xml version="1.0" encoding="UTF-8"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>Cột cờ Lũng Cú (Hà Giang)</w:t></w:r></w:p><w:p><w:r><w:t>Xã Phước Thọ, huyện Đất Đỏ, tỉnh Bà Rịa – Vũng Tàu</w:t></w:r></w:p><w:p><w:r><w:t>Việt Nam có 63 tỉnh, thành phố</w:t></w:r></w:p><w:sectPr/></w:body></w:document>'''
          with ZipFile('fixture.docx','w',ZIP_DEFLATED) as z: z.writestr('word/document.xml',xml)
          PY
      - name: Test v60
        run: |
          nohup python -m http.server 8000 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          cat > test.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await page.goto('http://127.0.0.1:8000/sua-giao-an/v60.html?v=6.0&test='+Date.now(),{waitUntil:'networkidle'});
          if(await page.locator('.subjectCheck').count()!==12) throw new Error('Checkbox count incorrect');
          for(const n of [0,1,2]) await page.locator('.subjectCheck').nth(n).check();
          const picked=await page.locator('#subjectPicked').innerText();
          if(!picked.includes('Lịch sử - Địa lí')||!picked.includes('Đạo đức')||!picked.includes('Toán')) throw new Error('Three-subject selection failed: '+picked);
          await page.locator('#files').setInputFiles('fixture.docx');
          await page.locator('#scan').click();
          await page.waitForTimeout(500);
          const count=Number(await page.locator('#cc').innerText());
          if(count<3) throw new Error('Expected 3+ Change Sets, got '+count);
          const text=await page.locator('#changes').innerText();
          for(const s of ['Lịch sử - Địa lí','Đạo đức','Toán']) if(!text.includes(s)) throw new Error('Missing subject '+s);
          for(const id of ['high','all','none']) if(await page.locator('#'+id).isDisabled()) throw new Error(id+' disabled');
          await page.locator('#all').click();
          if(await page.locator('.approved').count()<3) throw new Error('Approve all failed');
          await page.locator('#none').click();
          if(await page.locator('.rejected').count()<3) throw new Error('Reject all failed');
          await page.locator('#all').click();
          await page.locator('#apply').click();
          const val=await page.locator('#validator').innerText();
          if(!/Validator đạt/i.test(val)) throw new Error('Validator failed: '+val);
          if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
          console.log('V60_BROWSER_TEST_PASS', {picked,count,val});
          await browser.close();
          JS
          node test.mjs
      - name: Remove test workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/test-v60-buttons.yml || true
          git commit -m 'chore: remove v60 browser test' || true
          git push || true