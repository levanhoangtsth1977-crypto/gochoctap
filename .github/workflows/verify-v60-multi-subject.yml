name: verify-v60-multi-subject
on:
  push:
    paths:
      - '.github/workflows/verify-v60-multi-subject.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm init -y >/dev/null 2>&1 && npm install --no-save playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Create fixture
        run: |
          python - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          xml='''<?xml version="1.0" encoding="UTF-8"?>
          <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
            <w:body>
              <w:p><w:r><w:t>Cột cờ Lũng Cú (Hà Giang)</w:t></w:r></w:p>
              <w:p><w:r><w:t>Bốn tỉnh Tây Nguyên: Đắk Lắk, Lâm Đồng, Đắk Nông, Gia Lai</w:t></w:r></w:p>
              <w:p><w:r><w:t>Hang Sơn Đoòng (Quảng Bình)</w:t></w:r></w:p>
              <w:p><w:r><w:t>Hoạt động học tập gắn với môi trường và bảo vệ thiên nhiên.</w:t></w:r></w:p>
              <w:sectPr/>
            </w:body>
          </w:document>'''
          with ZipFile('fixture.docx','w',ZIP_DEFLATED) as z:
              z.writestr('word/document.xml',xml)
          PY
      - name: Browser verify
        run: |
          nohup python -m http.server 8000 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await page.goto('http://127.0.0.1:8000/sua-giao-an/v60.html?v=6.0&t='+Date.now(),{waitUntil:'networkidle'});
          if(await page.locator('.subjectCheck').count()!==12) throw new Error('Expected 12 checkboxes');
          for(const i of [0,2,3,4]) await page.locator('.subjectCheck').nth(i).check();
          const picked=await page.locator('#subjectPicked').innerText();
          for(const s of ['Lịch sử - Địa lí','Toán','Tiếng Việt','Khoa học']) if(!picked.includes(s)) throw new Error('Missing selected subject: '+s+' | '+picked);
          await page.locator('#files').setInputFiles('fixture.docx');
          await page.locator('#scan').click();
          await page.waitForFunction(()=>document.querySelector('#cc')?.textContent !== '0');
          const count=Number(await page.locator('#cc').innerText());
          if(count!==3) throw new Error('Expected exactly 3 administrative Change Sets, got '+count);
          const text=await page.locator('#changes').innerText();
          for(const s of ['Lịch sử - Địa lí','Toán','Tiếng Việt']) if(!text.includes(s)) throw new Error('Missing Change Set subject: '+s+' | '+text);
          const report=await page.locator('#report').innerText();
          for(const s of ['Lịch sử - Địa lí','Toán','Tiếng Việt','Khoa học']) if(!report.includes(s)) throw new Error('Missing subject in scan report: '+s+' | '+report);
          for(const id of ['high','all','none']) if(await page.locator('#'+id).isDisabled()) throw new Error(id+' disabled');
          await page.locator('#all').click();
          if(await page.locator('.approved').count()!==3) throw new Error('Approve all failed');
          await page.locator('#none').click();
          if(await page.locator('.rejected').count()!==3) throw new Error('Reject all failed');
          await page.locator('#high').click();
          if(await page.locator('.approved').count()!==3) throw new Error('Approve high-confidence failed');
          if(await page.locator('#apply').isDisabled()) throw new Error('Apply disabled after approval');
          await page.locator('#reset').click();
          if((await page.locator('#cc').innerText())!=='0') throw new Error('Reset did not clear Change Sets');
          if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
          console.log('V60_MULTI_SUBJECT_PASS', {picked,count,report});
          await browser.close();
          JS
          node verify.mjs
      - name: Remove verification workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-v60-multi-subject.yml || true
          git commit -m 'chore: remove temporary v60 verification workflow' || true
          git push || true