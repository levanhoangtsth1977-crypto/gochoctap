name: Final Apply Export Repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-apply-export-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'fix(sua-giao-an): final apply export repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v64 safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('sua-giao-an/v64.html')
          s=p.read_text(encoding='utf-8')

          old_apply="""function applyOne(c){const d=S.docs.find(x=>x.name===c.file);if(!d)throw Error(c.id+': thiếu file');if(c.type==='INTEGRATION')d.parts[c.path]=appendIntegration(d.parts[c.path],c.new);else{const dom=parse(c.path?d.parts[c.path]:d.parts['word/document.xml']),p=[...dom.getElementsByTagNameNS(NS,'p')][(c.paragraph||1)-1];if(!p||!replaceExact(p,c.old,c.new))throw Error(c.id+': không tìm thấy OLD đúng paragraph');d.parts[c.path]=new XMLSerializer().serializeToString(dom)}c.status='applied'}"""
          new_apply="""function applyOne(c){const d=S.docs.find(x=>x.name===c.file);if(!d)throw Error(c.id+': thiếu file');if(c.type==='INTEGRATION'){d.parts[c.path]=appendIntegration(d.parts[c.path],c.new)}else{const dom=parse(c.path?d.parts[c.path]:d.parts['word/document.xml']),ps=[...dom.getElementsByTagNameNS(NS,'p')];let p=c.paragraph>0?ps[c.paragraph-1]:null;if(c.old&&(!p||!norm(p.textContent).includes(norm(c.old))))p=ps.find(q=>norm(q.textContent).includes(norm(c.old)));if(!p||!c.old||!replaceExact(p,c.old,c.new))throw Error(c.id+': không tìm thấy OLD để thay thế');d.parts[c.path||'word/document.xml']=new XMLSerializer().serializeToString(dom)}c.status='applied'}"""
          if old_apply not in s: raise SystemExit('applyOne marker not found')
          s=s.replace(old_apply,new_apply,1)

          old_post="""for(const c of S.changes.filter(x=>x.status==='applied'&&x.type==='REPLACE'))if(!xmlText(S.docs.find(d=>d.name===c.file).parts[c.path]).includes(c.new))throw Error(c.id+': Post-Validator không thấy NEW');"""
          new_post="""for(const c of S.changes.filter(x=>x.status==='applied')){const d=S.docs.find(d=>d.name===c.file);const text=xmlText(d.parts[c.path||'word/document.xml']);if(!text.includes(c.new))throw Error(c.id+': Post-Validator không thấy NEW trong DOCX')}"""
          if old_post not in s: raise SystemExit('post-validator marker not found')
          s=s.replace(old_post,new_post,1)

          old_dl="""function dl(blob,name){function dl(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('word').addEventListener"""
          new_dl="""function dl(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('word').addEventListener"""
          if old_dl not in s: raise SystemExit('dl marker not found')
          s=s.replace(old_dl,new_dl,1)

          # Make integration preview immediately show after apply and make output explicit.
          old_bulk="$('bulk').textContent='✅ Áp dụng thành công · chữ sửa = đỏ + tô vàng · tích hợp = xanh + in nghiêng + tô vàng.';"
          new_bulk="$('bulk').textContent='✅ Áp dụng thành công · '+ap.length+' Change Set · chữ sửa = đỏ + tô vàng · tích hợp = xanh + in nghiêng + tô vàng.';"
          if old_bulk in s:s=s.replace(old_bulk,new_bulk,1)

          p.write_text(s,encoding='utf-8')
          assert s.count('function applyOne(c){')==1
          assert 'let p=c.paragraph>0?ps[c.paragraph-1]:null' in s
          assert "filter(x=>x.status==='applied')){const d=S.docs.find" in s
          assert 'function dl(blob,name){function dl(blob,name){' not in s
          assert s.count("$('word').addEventListener") == 1
          print('PATCH PASS',len(s))
      - name: Validate JS markers
        shell: python
        run: |
          from pathlib import Path
          s=Path('sua-giao-an/v64.html').read_text(encoding='utf-8')
          for x in ["function applyOne(c){", "let p=c.paragraph>0?ps[c.paragraph-1]:null", "filter(x=>x.status==='applied')", "function dl(blob,name){const", "$('word').addEventListener"]:
              assert x in s, x
          assert 'function dl(blob,name){function dl(blob,name){' not in s
          assert 'parseXml(' not in s
          assert 'xmlText(' in s
          print('VALIDATE PASS')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sua-giao-an/v64.html
          git commit -m 'fix(sua-giao-an): final apply export repair'
          git push
      - name: Remove one-shot workflow
        run: |
          git rm -f .github/workflows/fix-apply-export-final.yml || true
          git commit -m 'chore(sua-giao-an): remove final repair workflow' || true
          git push || true
