name: Final Apply Export Repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-apply-export-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'FINAL APPLY EXPORT REPAIRED')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact functions
        shell: python
        run: |
          from pathlib import Path
          p=Path('sua-giao-an/v64.html')
          s=p.read_text(encoding='utf-8')

          # Replace applyOne as a whole, using the next function as a hard boundary.
          a=s.find('function applyOne(c){')
          b=s.find('function validate(){',a)
          if a<0 or b<0: raise SystemExit('applyOne boundary not found')
          fn="""function applyOne(c){const d=S.docs.find(x=>x.name===c.file);if(!d)throw Error(c.id+': thiếu file');if(c.type==='INTEGRATION'){const part=c.path||'word/document.xml';if(!d.parts[part])throw Error(c.id+': thiếu XML part');d.parts[part]=appendIntegration(d.parts[part],c.new)}else{const part=c.path||'word/document.xml';if(!d.parts[part])throw Error(c.id+': thiếu XML part');const dom=parse(d.parts[part]),ps=[...dom.getElementsByTagNameNS(NS,'p')];let target=c.paragraph>0?ps[c.paragraph-1]:null;if(c.old&&(!target||!norm(target.textContent||'').includes(norm(c.old))))target=ps.find(q=>norm(q.textContent||'').includes(norm(c.old)));if(!target||!c.old||!replaceExact(target,c.old,c.new))throw Error(c.id+': không tìm thấy OLD trong DOCX');d.parts[part]=new XMLSerializer().serializeToString(dom)}c.status='applied'}"""
          s=s[:a]+fn+s[b:]

          # Extend post-check from REPLACE-only to every applied change.
          old="for(const c of S.changes.filter(x=>x.status==='applied'&&x.type==='REPLACE'))if(!xmlText(S.docs.find(d=>d.name===c.file).parts[c.path]).includes(c.new))throw Error(c.id+': Post-Validator không thấy NEW');"
          new="for(const c of S.changes.filter(x=>x.status==='applied')){const d=S.docs.find(d=>d.name===c.file);const text=xmlText(d.parts[c.path||'word/document.xml']);if(!text.includes(c.new))throw Error(c.id+': Post-Validator không thấy NEW trong DOCX')}"
          if old not in s: raise SystemExit('post-check boundary not found')
          s=s.replace(old,new,1)

          # Fix duplicate download helper without touching event handlers.
          s=s.replace('function dl(blob,name){function dl(blob,name){','function dl(blob,name){',1)

          # Ensure Export buttons remain wired exactly once.
          if s.count("$('word').addEventListener")!=1: raise SystemExit('word handler count invalid')
          if s.count("$('zip').addEventListener")!=1: raise SystemExit('zip handler count invalid')
          if s.count("$('log').addEventListener")!=1: raise SystemExit('log handler count invalid')
          p.write_text(s,encoding='utf-8')
          print('PATCH PASS',len(s))
      - name: Validate final source
        shell: python
        run: |
          from pathlib import Path
          s=Path('sua-giao-an/v64.html').read_text(encoding='utf-8')
          tests={
            'apply_fallback':'let target=c.paragraph>0?ps[c.paragraph-1]:null;' in s,
            'postcheck_all':"filter(x=>x.status==='applied')){" in s,
            'single_dl':'function dl(blob,name){function dl(blob,name){' not in s,
            'word_handler':s.count("$('word').addEventListener")==1,
            'zip_handler':s.count("$('zip').addEventListener")==1,
            'log_handler':s.count("$('log').addEventListener")==1,
            'parser':'function parse(x)' in s and 'function xmlText(x)' in s,
            'preview':'previewExportBtn' in s,
          }
          print(tests)
          bad=[k for k,v in tests.items() if not v]
          if bad: raise SystemExit('VALIDATE FAIL: '+','.join(bad))
      - name: Commit repaired v64
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sua-giao-an/v64.html
          git commit -m 'FINAL APPLY EXPORT REPAIRED'
          git push
      - name: Remove this one-shot workflow
        run: |
          git rm -f .github/workflows/fix-apply-export-final.yml
          git commit -m 'chore: remove one-shot apply export repair'
          git push