name: One-shot Gemini preview final
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-gemini-preview-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic patch
        run: python .github/scripts/patch_gemini_preview.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('sua-giao-an/v64.html').read_text(encoding='utf-8')
          assert s.count('id="previewExportBtn"') == 1
          assert s.count("$('previewExportBtn').addEventListener('click'") == 1
          assert '.slice(0,120000)' in s
          assert '.slice(0,18000)' in s
          print('VALIDATE PASS')
          PY
      - name: Commit v64
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sua-giao-an/v64.html
          git commit -m 'fix(sua-giao-an): speed Gemini and repair preview' || true
          git push
      - name: Remove patch helpers
        if: ${{ success() }}
        run: |
          git rm .github/scripts/patch_gemini_preview.py .github/workflows/one-shot-gemini-preview-final.yml || true
          git commit -m 'chore(sua-giao-an): remove one-shot patch helpers' || true
          git push || true
