name: One-shot Gemini final fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gemini-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v64 Gemini handlers safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('sua-giao-an/v64.html')
          s=p.read_text(encoding='utf-8')
          # Fix undefined model in analysis handler by using the selected model.
          s=s.replace("encodeURIComponent(model)+':generateContent'", "encodeURIComponent($('model').value || 'gemini-3.8-flash')+':generateContent'")
          # Replace Gemini test with a robust, model-fallback check and detailed errors.
          start=s.find("$('gemTest').addEventListener('click'")
          end=s.find("$('gemRun').addEventListener", start)
          if start < 0 or end < 0:
              raise SystemExit('Gemini test handler markers not found')
          new="""$('gemTest').addEventListener('click',async()=>{try{const key=$('gemKey').value.trim();if(!key)throw Error('Chưa có Gemini API Key');const selected=$('model').value||'gemini-3.8-flash';const models=[...new Set([selected,'gemini-3.8-flash','gemini-3.7-flash','gemini-3.6-flash','gemini-2.5-flash'])];$('gemStatus').textContent='⏳ Đang kiểm tra Gemini…';let last='';for(const model of models){try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{role:'user',parts:[{text:'Reply with exactly OK.'}]}]})});const raw=await r.text();if(r.ok){let j={};try{j=JSON.parse(raw)}catch{}if(!j?.candidates?.length)throw Error('API trả phản hồi nhưng không có candidates');$('model').value=model;$('gemStatus').textContent='✅ Gemini hoạt động · '+model;return}let detail='';try{const j=JSON.parse(raw);detail=j?.error?.message||j?.error?.status||''}catch{}last='HTTP '+r.status+' · '+model+(detail?' · '+detail:'');if(r.status===401||r.status===403)break}catch(e){last=String(e.message||e)+' · '+model}}throw Error(last||'Không kết nối được Gemini')}catch(e){$('gemStatus').textContent='❌ '+e.message;audit('Gemini TEST '+e.message)}});"""
          s=s[:start]+new+s[end:]
          assert "encodeURIComponent($('model').value || 'gemini-3.8-flash')+':generateContent'" in s
          assert "$('gemTest').addEventListener('click'" in s
          assert 'gemini-2.5-flash' in s
          p.write_text(s,encoding='utf-8')
          print('PATCH PASS',len(s))
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sua-giao-an/v64.html
          git commit -m 'fix(sua-giao-an): final Gemini compatibility fix' || exit 0
          git push
