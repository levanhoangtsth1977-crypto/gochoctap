name: repair-v60-runtime
on:
  push:
    paths:
      - '.github/workflows/fix-v60-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair v60 JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sua-giao-an/v60.html')
          s = p.read_text(encoding='utf-8')
          old = 'function runGemini(){'
          new = 'async function runGemini(){'
          if old in s and new not in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sua-giao-an/v60.html
          git diff --cached --quiet || git commit -m 'fix: restore v60 button handlers'
          git push