name: CLEAN V60 ONCE
on:
  push:
    paths:
      - .github/cleanup-v60-trigger.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run deterministic cleanup
        run: python3 .github/cleanup_v60.py
