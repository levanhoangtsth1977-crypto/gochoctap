name: CLEAN V60 ONCE
on:
  workflow_dispatch:
  push:
    paths:
      - .github/cleanup-v60-trigger.txt
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and clean v60 from pre-patch base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          base='7daa9485da45ad4f1b4fc5ed263b3d6a92a51959'
          target=Path('sua-giao-an/v60.html')
          s=subprocess.check_output(['git','show',f'{base}:sua-giao-an/v60.html'],text=True)
          # Gemini: exactly 3.7 primary + 3.6 fallback.
          s=s.replace('value="gemini-2.5-flash">Gemini 2.5 Flash — tiết kiệm','value="gemini-3.6-flash">Gemini 3.6 Flash — dự phòng ổn định')
          s=s.replace('gemini-2.5-flash','gemini-3.6-flash')
          s=s.replace('Gemini 3.7 Flash — ổn định','Gemini 3.7 Flash — khuyên dùng')
          # Remove any excluded subject options if present.
          for v in ('TIENG_ANH','TIN_HOC','MI_THUAT','AM_NHAC'):
              s=re.sub(r'<label><input class="subjectCheck" type="checkbox" value="'+v+r'">.*?</label>','',s,flags=re.S)
          s=re.sub(r"TIENG_ANH:'Tiếng Anh',TIN_HOC:'Tin học',MI_THUAT:'Mĩ thuật',AM_NHAC:'Âm nhạc',",'',s)
          # Keep one parseGeminiJSON implementation.
          a=s.find('function parseGeminiJSON(')
          if a>=0:
              b=s.find('async function runGemini(prompt)',a)
              block=s[a:b]
              sec=block.find('function parseGeminiJSON(',1)
              if sec>=0: s=s[:a]+block[:sec]+s[b:]
          # Keep one Safe XML implementation from the base.
          a=s.find('function __v60SafeXmlEdit(')
          if a>=0:
              b=s.find('function replaceRun(xml,c)',a)
              block=s[a:b]
              sec=block.find('function __v60SafeXmlEdit(',1)
              if sec>=0: s=s[:a]+block[:sec]+s[b:]
          # Use the single-document fallback and current anchor at APPLY time.
          marker="$('apply').onclick=()=>{"
          a=s.find(marker)
          b=s.find("$('gemTest').onclick=",a)
          if a>=0 and b>a:
              apply=r'''$('apply').onclick=()=>{let ok=0,fail=[];const original=S.docs.map(d=>({d,parts:{...d.parts}}));const resolve=(c)=>S.docs.find(d=>d.name===c.document||d.source===c.document)||(S.docs.length===1?S.docs[0]:null);for(const d of S.docs){const cs=S.changes.filter(c=>c.approved&&!c.rejected&&resolve(c)===d).sort((x,y)=>(y.paragraphIndex-x.paragraphIndex)||((y.matchStart||0)-(x.matchStart||0)));for(const c of cs){const doc=resolve(c);if(!doc){fail.push(c.id+': không xác định được tài liệu.');continue}const part=doc.parts[c.part];if(typeof part!=='string'){fail.push(c.id+': thiếu '+c.part+'.');continue}const ps=pars(part);const hint=ps[c.paragraphIndex];let idx=c.anchor&&hint?hint.text.indexOf(c.anchor):-1;let pi=c.paragraphIndex;if(idx<0&&c.anchor){for(const p of ps){const q=p.text.indexOf(c.anchor);if(q>=0){if(idx>=0){idx=-2;break}idx=q;pi=p.i}}}if(c.anchor&&idx<0){fail.push(c.id+': Anchor không còn tồn tại hoặc không duy nhất.');continue}const cc={...c,paragraphIndex:pi,matchStart:idx<0?0:idx};const r=c.type==='INTEGRATION'?appendRun(part,cc):replaceRun(part,cc);if(!r||!r.ok){fail.push(c.id+': '+(r?.reason||'Không áp dụng được.'));continue}doc.parts[c.part]=r.xml;c.applied=true;ok++}}if(fail.length){for(const x of original)x.d.parts={...x.parts};S.applied=false;$('aa').textContent='0';$('word').disabled=$('zip').disabled=true;$('validator').textContent='❌ APPLY rollback toàn bộ.\n'+fail.join(' | ');$('out').textContent='❌ '+fail.join(' | ');$('bulkStatus').textContent='❌ APPLY rollback toàn bộ.';audit('APPLY rollback: '+fail.join(' | '));return}const bad=S.changes.filter(c=>c.applied&&!validate(S.docs.find(d=>d.name===c.document)||S.docs[0],c));if(bad.length){for(const x of original)x.d.parts={...x.parts};S.applied=false;S.changes.forEach(c=>c.applied=false);$('aa').textContent='0';$('word').disabled=$('zip').disabled=true;$('validator').textContent='❌ POST-VALIDATOR thất bại. Đã rollback toàn bộ.';$('out').textContent='❌ '+bad.map(c=>c.id).join(' | ');return}S.applied=ok>0;$('aa').textContent=ok;$('word').disabled=$('zip').disabled=!S.applied;$('log').disabled=!S.applied;$('validator').textContent='✅ Validator đạt · '+ok+' thay đổi.';$('out').textContent='✅ Bản làm việc đã sửa. Có thể xuất Word/ZIP.';$('bulkStatus').textContent='✏️ Đã áp dụng '+ok+' Change Set.';step(7);audit('Áp dụng '+ok+' thay đổi.');};
'''
              s=s[:a]+apply+s[b:]
          target.write_text(s,encoding='utf-8')
          # Minimal entrypoint: no iframe bridge, only direct redirect.
          Path('sua-giao-an/index.html').write_text('''<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>🛠️ Trang Sửa Giáo Án · v6.0</title></head><body><script>location.replace('./v60.html?v=6.0&cb=202609020945');</script><noscript><a href="./v60.html?v=6.0&cb=202609020945">Mở Trang Sửa Giáo Án v6.0</a></noscript></body></html>''',encoding='utf-8')
          print('CLEAN_V60_SOURCE_READY',len(s))
          PY
      - name: Validate clean runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          v=Path('sua-giao-an/v60.html').read_text(encoding='utf-8')
          i=Path('sua-giao-an/index.html').read_text(encoding='utf-8')
          for bad in ('gemini-2.5-flash','value="TIENG_ANH"','value="TIN_HOC"','value="MI_THUAT"','value="AM_NHAC"'):
              if bad in v: raise SystemExit('BAD:'+bad)
          if v.count('function parseGeminiJSON(')!=1: raise SystemExit('parseGeminiJSON_DUPLICATE')
          if v.count('function __v60SafeXmlEdit(')!=1: raise SystemExit('SAFE_XML_DUPLICATE')
          if v.count("$('apply').onclick=")!=1: raise SystemExit('APPLY_DUPLICATE')
          if v.count("$('word').onclick=")!=1: raise SystemExit('WORD_DUPLICATE')
          if v.count("$('zip').onclick=")!=1: raise SystemExit('ZIP_DUPLICATE')
          if 'gemini-3.7-flash' not in v or 'gemini-3.6-flash' not in v: raise SystemExit('GEMINI_MODELS_MISSING')
          if '<iframe' in i or 'contentDocument' in i: raise SystemExit('INDEX_BRIDGE_REMAINS')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',v,re.S)
          if not scripts: raise SystemExit('NO_SCRIPT')
          Path('/tmp/v60.js').write_text(max(scripts,key=len),encoding='utf-8')
          print('CLEAN_V60_VERIFY_OK')
          PY
          node --check /tmp/v60.js
      - name: Remove legacy patch/build files
        run: |
          git rm -f .github/v60-live-fix-trigger.txt .github/v60-final-fix-trigger.txt 2>/dev/null || true
          git rm -f .github/scripts/*.py 2>/dev/null || true
          git rm -f sua-giao-an/v60-hotfix.html sua-giao-an/v60-ui-bridge.js sua-giao-an/document-engine-bridge.js sua-giao-an/subject-picker.js 2>/dev/null || true
          git rm -f sua-giao-an/v04.html sua-giao-an/v08.html sua-giao-an/v09.html sua-giao-an/v10.html sua-giao-an/v11.html sua-giao-an/v12.html sua-giao-an/v13.html sua-giao-an/v13.js sua-giao-an/v14.html 2>/dev/null || true
          git rm -rf sua-giao-an/v08 sua-giao-an/api sua-giao-an/backend 2>/dev/null || true
          git rm -f sua-giao-an/requirements.txt sua-giao-an/vercel.json 2>/dev/null || true
      - name: Replace V60 workflow with validation-only CI
        run: |
          cat > .github/workflows/v60-live-fix.yml <<'YAML'
          name: V60 CI
          on:
            push:
              paths:
                - sua-giao-an/v60.html
                - sua-giao-an/index.html
                - sua-giao-an/SPEC.md
                - sua-giao-an/*.json
                - sua-giao-an/tests/**
                - .github/workflows/v60-live-fix.yml
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Validate V60
                  run: |
                    python3 - <<'PY'
                    from pathlib import Path
                    import re
                    v=Path('sua-giao-an/v60.html').read_text(encoding='utf-8')
                    i=Path('sua-giao-an/index.html').read_text(encoding='utf-8')
                    for bad in ('gemini-2.5-flash','value="TIENG_ANH"','value="TIN_HOC"','value="MI_THUAT"','value="AM_NHAC"'):
                        if bad in v: raise SystemExit('FORBIDDEN:'+bad)
                    for fn in ('parseGeminiJSON','__v60SafeXmlEdit'):
                        if len(re.findall(r'function '+re.escape(fn)+r'\(',v))!=1: raise SystemExit('DUP:'+fn)
                    if v.count("$('apply').onclick=")!=1: raise SystemExit('APPLY_HANDLER_COUNT')
                    if v.count("$('word').onclick=")!=1 or v.count("$('zip').onclick=")!=1: raise SystemExit('EXPORT_HANDLER_COUNT')
                    if '<iframe' in i or 'contentDocument' in i: raise SystemExit('LEGACY_INDEX_BRIDGE')
                    scripts=re.findall(r'<script[^>]*>(.*?)</script>',v,re.S)
                    Path('/tmp/v60.js').write_text(max(scripts,key=len),encoding='utf-8')
                    print('V60_CI_SOURCE_OK')
                    PY
                    node --check /tmp/v60.js
          YAML
      - name: Remove this one-time cleanup workflow and trigger
        run: |
          git rm -f .github/workflows/cleanup-v60-once.yml 2>/dev/null || true
          git rm -f .github/cleanup-v60-trigger.txt 2>/dev/null || true
      - name: Commit cleanup
        run: |
          git config user.name 'v60-cleanup'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(sua-giao-an): restore clean v6.0 and remove legacy patches'
          git push
