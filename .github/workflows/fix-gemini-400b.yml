name: One-shot Gemini 400b fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gemini-400b.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Gemini test handler
        shell: python
        run: |
          from pathlib import Path
          p=Path('sua-giao-an/v64.html')
          s=p.read_text(encoding='utf-8')
          start=s.find("$('gemTest').addEventListener('click'")
          end=s.find("$('gemRun').addEventListener", start)
          if start < 0 or end < 0: raise SystemExit('Gemini test handler markers not found')
          new="""$('gemTest').addEventListener('click',async()=>{try{const key=$('gemKey').value.trim();if(!key)throw Error('Chưa có Gemini API Key');const model=$('model').value||'gemini-3.8-flash';$('gemStatus').textContent='⏳ Đang kiểm tra '+model+'…';const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:'OK'}]}]})});const raw=await r.text();if(!r.ok){let detail=raw;try{const j=JSON.parse(raw);detail=j?.error?.message||raw}catch{}throw Error('Gemini HTTP '+r.status+' · '+detail)}const j=JSON.parse(raw);if(!j?.candidates?.[0]?.content?.parts?.[0]?.text)throw Error('Gemini trả phản hồi không hợp lệ');$('gemStatus').textContent='✅ Gemini hoạt động · '+model}catch(e){$('gemStatus').textContent='❌ '+e.message}});"""
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          assert s.count("$('gemTest').addEventListener('click'")==1
          print('PATCH PASS')
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sua-giao-an/v64.html
          git commit -m 'fix(sua-giao-an): simplify Gemini test and expose API error' || exit 0
          git push